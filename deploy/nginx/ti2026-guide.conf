# 将 ti.example.com 改成你的实际域名。
# TLS/HTTPS 可由宝塔、1Panel、certbot 或现有证书管理工具接管。
server {
    listen 80;
    server_name ti.example.com;

    access_log /var/log/nginx/ti2026-guide.access.log;
    error_log  /var/log/nginx/ti2026-guide.error.log;

    location /assets/ {
        proxy_pass http://127.0.0.1:17826;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:17826;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        add_header Cache-Control "no-store";
    }

    location / {
        proxy_pass http://127.0.0.1:17826;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

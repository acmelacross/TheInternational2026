name: Apply Aug 20 timeline sync
on:
  push:
    paths:
      - '.github/workflows/apply-aug20-timeline-sync.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply patch
        run: python3 scripts/fix_timeline_aug20_20260818.py
      - name: Validate JSON and JS
        run: |
          python3 -m json.tool data/seed.json >/dev/null
          node --check server.js
          node --check public/app.js
          node --check public/predictions.js
          node --check public/ai-analysis.js
          npm test
          git diff --check
      - name: Commit verified sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/fix_timeline_aug20_20260818.py .github/workflows/apply-aug20-timeline-sync.yml
          git add data/seed.json
          git commit -m "Correct TI2026 Aug 20 timeline summary"
          git push

name: Sync TI2026 final elimination result
on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync_elim_final_auto.py'
      - '.github/workflows/sync-elim-final-auto.yml'
jobs:
  sync:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply result
        run: python3 scripts/sync_elim_final_auto.py
      - name: Validate
        run: |
          python3 -m json.tool data/seed.json >/dev/null
          node --check server.js
          node --check public/app.js
          node --check public/predictions.js
          node --check public/ai-analysis.js
          npm test
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/sync_elim_final_auto.py .github/workflows/sync-elim-final-auto.yml scripts/check_latest_schedule_auto.py .github/workflows/check-latest-schedule-auto.yml
          git add data/seed.json
          git commit -m "Sync final TI2026 elimination result"
          git push

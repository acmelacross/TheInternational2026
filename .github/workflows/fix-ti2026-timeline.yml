name: Fix TI2026 timeline
on:
  push:
    paths:
      - '.github/workflows/fix-ti2026-timeline.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix timeline and validate
        run: |
          python3 - <<'PY'
          import json
          p='data/seed.json'
          d=json.load(open(p))
          changed=0
          for x in d.get('timeline',[]):
            if x.get('date')=='2026-08-21':
              for k in ('detail','note'):
                v=x.get(k,'')
                nv=v.replace('13:30 Team Liquid vs Team Falcons','14:15 Team Liquid vs Team Falcons').replace('13:00 Team Liquid vs Team Falcons','14:15 Team Liquid vs Team Falcons')
                if nv!=v:
                  x[k]=nv; changed+=1
          if not changed:
            raise SystemExit('nothing to fix')
          open(p,'w').write(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          python3 -m json.tool data/seed.json >/dev/null
          node --check server.js
          node --check public/app.js
          node --check public/predictions.js
          node --check public/ai-analysis.js
          npm test
          git diff --check
          test -z "$(git status --short public/assets/teams-normal)"
      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-ti2026-timeline.yml
          git add data/seed.json
          git commit -m "Align TI2026 Aug 21 timeline time"
          git push

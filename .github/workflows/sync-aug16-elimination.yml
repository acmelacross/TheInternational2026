name: Sync TI2026 Aug 16 elimination schedule
on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync_aug16_elimination_slots.py'
      - '.github/workflows/sync-aug16-elimination.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply confirmed schedule slots
        run: python3 scripts/sync_aug16_elimination_slots.py
      - name: Validate
        run: |
          python3 -m json.tool data/seed.json >/dev/null
          node --check server.js
          node --check public/app.js
          node --check public/predictions.js
          node --check public/ai-analysis.js
          npm test
      - name: Verify exact published slots
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('data/seed.json'))
          rows=[m for m in d['matches'] if str(m.get('id','')).startswith('seed-d4-elim-')]
          assert len(rows)==5, rows
          assert sum(m['startsAt']=='2026-08-16T20:00:00+08:00' for m in rows)==4
          assert sum(m['startsAt']=='2026-08-16T22:00:00+08:00' for m in rows)==1
          assert all(m['status']=='tbd' and m['bestOf']==3 for m in rows)
          assert all(all(str(t['name']).startswith('待定') for t in m['teams']) for m in rows)
          print('AUG16_ELIMINATION_SLOTS_OK')
          PY
      - name: Commit synced data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/sync_aug16_elimination_slots.py .github/workflows/sync-aug16-elimination.yml
          git add data/seed.json
          git commit -m 'Sync published TI2026 Aug 16 elimination time slots'
          git push

name: Sync TI2026 Aug 21 result
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify and patch from XGoat Liquipedia MediaWiki
        run: python3 scripts/sync_ti2026_aug21_result.py
      - name: Validate
        run: |
          python3 -m json.tool data/seed.json >/dev/null
          node --check server.js
          node --check public/app.js
          node --check public/predictions.js
          node --check public/ai-analysis.js
          npm test
          git diff --check
          if git status --short public/assets/teams-normal | grep .; then echo 'Logo directory changed'; exit 1; fi
      - name: Commit verified update and clean temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/sync_ti2026_aug21_result.py .github/workflows/sync-ti2026-aug21-result.yml
          git add data/seed.json
          git commit -m "Sync confirmed TI2026 Aug 21 lower-bracket result"
          git push

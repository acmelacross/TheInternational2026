name: Add OpenDota league source and health status
on:
  push:
    paths:
      - '.github/workflows/add-opendota-league-health.yml'
      - 'scripts/patch-opendota-league-health.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/patch-opendota-league-health.py
      - name: Validate
        run: |
          node --check server.js
          node --check public/app.js
          grep -q "fetchOpenDotaLeagueMatches" server.js
          grep -q "api/source-health" server.js
          grep -q "OPENDOTA_TI_LEAGUE_ID=19719" .env.example
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js public/app.js .env.example
          git rm scripts/patch-opendota-league-health.py .github/workflows/add-opendota-league-health.yml
          git commit -m "Add OpenDota TI league source and health status"
          git push
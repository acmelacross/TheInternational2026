name: Fix Kimi K3 global endpoint

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-kimi-k3-global-endpoint.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Patch Kimi K3 endpoint and diagnostics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ai-service.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("kimi:'kimi-k3-schema-v4-20260813'", "kimi:'kimi-k3-global-v5-20260813'", 1)

          old="function cleanBase(v) { return String(v || '').replace(/\\/+$/, ''); }\n"
          new="function cleanBase(v) { return String(v || '').replace(/\\/+$/, ''); }\nfunction kimiBaseUrl() {\n  const configured = cleanBase(envFirst('KIMI_BASE_URL'));\n  if (!configured || /^https:\\/\\/api\\.moonshot\\.cn\\/v1$/i.test(configured)) return 'https://api.moonshot.ai/v1';\n  return configured;\n}\n"
          if old not in s: raise SystemExit('cleanBase marker not found')
          s=s.replace(old,new,1)

          old="baseUrl:cleanBase(envFirst('KIMI_BASE_URL')||'https://api.moonshot.cn/v1')"
          new="baseUrl:kimiBaseUrl()"
          if old not in s: raise SystemExit('kimi base marker not found')
          s=s.replace(old,new,1)

          old="const raw=await res.text(); let json=null; try{json=JSON.parse(raw)}catch(_){}"
          new="const raw=await res.text(); const responseType=res.headers.get('content-type')||''; let json=null; try{json=JSON.parse(raw)}catch(_){}"
          if old not in s: raise SystemExit('raw marker not found')
          s=s.replace(old,new,1)

          old="const shape={topKeys:json&&typeof json==='object'?Object.keys(json).slice(0,12):[],choiceCount:Array.isArray(json?.choices)?json.choices.length:null,choiceKeys:choice&&typeof choice==='object'?Object.keys(choice).slice(0,12):[],messageKeys:msg&&typeof msg==='object'?Object.keys(msg).slice(0,12):[],contentType:Array.isArray(msg?.content)?'array':typeof msg?.content,contentLength:typeof msg?.content==='string'?msg.content.length:null,reasoningLength:typeof msg?.reasoning_content==='string'?msg.reasoning_content.length:null};"
          new="const shape={httpStatus:res.status,responseType,rawLength:raw.length,topKeys:json&&typeof json==='object'?Object.keys(json).slice(0,12):[],choiceCount:Array.isArray(json?.choices)?json.choices.length:null,choiceKeys:choice&&typeof choice==='object'?Object.keys(choice).slice(0,12):[],messageKeys:msg&&typeof msg==='object'?Object.keys(msg).slice(0,12):[],contentType:Array.isArray(msg?.content)?'array':typeof msg?.content,contentLength:typeof msg?.content==='string'?msg.content.length:null,reasoningLength:typeof msg?.reasoning_content==='string'?msg.reasoning_content.length:null};"
          if old not in s: raise SystemExit('shape marker not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          e=Path('.env.example')
          t=e.read_text(encoding='utf-8')
          t=t.replace('KIMI_BASE_URL=https://api.moonshot.cn/v1','KIMI_BASE_URL=https://api.moonshot.ai/v1')
          e.write_text(t,encoding='utf-8')
          PY

      - name: Validate
        run: |
          node --check ai-service.js
          grep -q "kimi-k3-global-v5-20260813" ai-service.js
          grep -q "https://api.moonshot.ai/v1" ai-service.js
          grep -q "baseUrl:kimiBaseUrl()" ai-service.js
          grep -q "rawLength:raw.length" ai-service.js
          grep -q "KIMI_BASE_URL=https://api.moonshot.ai/v1" .env.example

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/fix-kimi-k3-global-endpoint.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Kimi K3 global API endpoint"
          git push

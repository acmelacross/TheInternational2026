name: Sync TI2026 Aug 22 confirmed updates
on:
  push:
    paths:
      - '.github/workflows/sync-ti-aug22-latest.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch confirmed schedule and result
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/seed.json')
          d=json.loads(p.read_text())
          changed=0
          for m in d.get('matches',[]):
              stage=str(m.get('stage',''))
              starts=str(m.get('startsAt',''))
              names=[str(t.get('name','')) for t in m.get('teams',[])[:2]]
              if starts.startswith('2026-08-22') and '胜者组决赛' in stage and {'Team VISION','Team Yandex'}.issubset(set(names)):
                  if m.get('startsAt')!='2026-08-22T16:45:00+08:00':
                      m['startsAt']='2026-08-22T16:45:00+08:00'; changed+=1
                  for t in m['teams']:
                      score=2 if t.get('name')=='Team VISION' else 1 if t.get('name')=='Team Yandex' else t.get('score')
                      if t.get('score')!=score: t['score']=score; changed+=1
                  if m.get('status')!='finished': m['status']='finished'; changed+=1
                  if m.get('source')!='blast-confirmed-result': m['source']='blast-confirmed-result'; changed+=1
              if starts.startswith('2026-08-22') and '败者组第3轮' in stage:
                  if m.get('startsAt')!='2026-08-22T21:00:00+08:00':
                      m['startsAt']='2026-08-22T21:00:00+08:00'; changed+=1
                  target=['BoomBoys','Team Spirit']
                  if [t.get('name') for t in m.get('teams',[])[:2]]!=target:
                      m['teams']=[{'name':'BoomBoys','score':None},{'name':'Team Spirit','score':None}]; changed+=1
                  else:
                      for t in m['teams'][:2]:
                          if t.get('score') is not None: t['score']=None; changed+=1
                  if m.get('status')!='upcoming': m['status']='upcoming'; changed+=1
                  if m.get('source')!='blast-confirmed-schedule': m['source']='blast-confirmed-schedule'; changed+=1
          for x in d.get('timeline',[]):
              if x.get('date')=='2026-08-22':
                  new='主赛事 Day 3：10:10 Team Spirit 2:1 Team Liquid（败者组第2轮，已结束）；13:00 Nigma Galaxy 1:2 BoomBoys（败者组第2轮，已结束）；16:45 TEAM VISION 2:1 Team Yandex（胜者组决赛，已结束）；21:00 BoomBoys vs Team Spirit（败者组第3轮，BO3，当前进行中比分不写死）。'
                  if x.get('detail')!=new: x['detail']=new; changed+=1
                  note='仅同步公开数据源明确发布的对阵、时间和最终赛果；进行中比分不固化，后续场次未确认的信息继续等待可靠来源发布，不自行推算。'
                  if x.get('note')!=note: x['note']=note; changed+=1
          if not changed:
              raise SystemExit('No changes required')
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          print('changed fields:',changed)
          PY
      - name: Validate
        run: |
          python3 -m json.tool data/seed.json >/dev/null
          node --check server.js
          node --check public/app.js
          node --check public/predictions.js
          node --check public/ai-analysis.js
          npm test
          git diff --check
          if ! git diff --quiet -- public/assets/teams-normal; then echo 'Logo directory modified unexpectedly'; exit 1; fi
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/sync-ti-aug22-latest.yml
          git add data/seed.json
          git commit -m 'Sync confirmed TI2026 Aug 22 updates'
          git push

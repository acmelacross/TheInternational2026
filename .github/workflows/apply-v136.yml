name: Apply TI2026 v1.3.6

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-v136.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Snapshot user team logos
        run: |
          find public/assets/teams-normal -type f -print0 2>/dev/null | sort -z | xargs -0 sha256sum > /tmp/logos.before || true
      - name: Apply v1.3.6
        run: node scripts/apply-v136.js
      - name: Verify logos unchanged
        run: |
          find public/assets/teams-normal -type f -print0 2>/dev/null | sort -z | xargs -0 sha256sum > /tmp/logos.after || true
          diff -u /tmp/logos.before /tmp/logos.after
      - name: Validate
        run: |
          node --check server.js
          node --check public/app.js
          node --check public/match.js
          node --check public/ai-analysis.js
          node tests.js
          grep -q '^\.env$' .gitignore
          grep -q '^\.env\.\*$' .gitignore
          grep -q '^!\.env\.example$' .gitignore
          ! grep -q 'chinaProfilesSection' public/index.html
          grep -q '布尔信息科技(山东)有限公司' public/index.html
          grep -q 'https://buer.top' public/index.html
      - name: Remove one-time files
        run: |
          rm -f scripts/apply-v136.js
          rm -f .github/workflows/apply-v136.yml
      - name: Commit v1.3.6
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update TI2026 viewing guide to v1.3.6"
          git push

name: TI sync apply now
on:
  push:
    paths:
      - '.github/workflows/ti-sync-apply-now.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply confirmed published schedule updates
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/seed.json')
          d=json.loads(p.read_text())
          changed=[]
          for m in d.get('matches',[]):
              teams=[str(t.get('name','')) for t in m.get('teams',[])[:2]]
              st=str(m.get('stage',''))
              if '胜者组半决赛 1' in st and set(teams)=={'Team Spirit','Team VISION'}:
                  if m.get('startsAt')!='2026-08-21T18:20:00+08:00':
                      m['startsAt']='2026-08-21T18:20:00+08:00'
                      m['source']='blast+liquipedia-mediawiki-published'
                      changed.append(m.get('id'))
              elif '胜者组半决赛 2' in st and set(teams)=={'Team Yandex','Nigma Galaxy'}:
                  if m.get('startsAt')!='2026-08-21T20:30:00+08:00':
                      m['startsAt']='2026-08-21T20:30:00+08:00'
                      m['source']='blast+liquipedia-mediawiki-published'
                      changed.append(m.get('id'))
              elif '败者组第2轮 2' in st and str(m.get('startsAt','')).startswith('2026-08-22T10:00:00'):
                  names=[str(t.get('name','')) for t in m.get('teams',[])[:2]]
                  if 'Team Liquid' not in names:
                      m['teams']=[{'name':'待定','score':None},{'name':'Team Liquid','score':None}]
                      m['status']='tbd'
                      m['source']='blast+liquipedia-mediawiki-published'
                      changed.append(m.get('id'))
          for t in d.get('timeline',[]):
              if t.get('date')=='2026-08-21':
                  new_detail='主赛事 Day 2：10:00 Iron Wing 1:2 BoomBoys 已结束；14:15 Team Liquid vs Team Falcons；18:20 Team Spirit vs TEAM VISION；20:30 Team Yandex vs Nigma Galaxy。'
                  new_note='Iron Wing 1:2 BoomBoys 为 BLAST 已确认最终赛果；18:20 与 20:30 为 BLAST + Liquipedia MediaWiki 最新已发布时间。其余进行中场次继续由实时数据源更新，不写死临时比分。'
                  if t.get('detail')!=new_detail or t.get('note')!=new_note:
                      t['detail']=new_detail; t['note']=new_note; changed.append('timeline-0821')
              if t.get('date')=='2026-08-22':
                  new_note='主赛事 Day 3：10:00 败者组第2轮已明确包含 Team Liquid；13:00 败者组第2轮已明确包含 BoomBoys；16:00 胜者组决赛；19:00 败者组第3轮。其余 TBD 对阵等待可靠数据源明确发布，不根据晋级关系自行推算。'
                  if t.get('note')!=new_note:
                      t['note']=new_note; changed.append('timeline-0822')
          if not changed:
              print('NO_CHANGES')
          else:
              p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
              print('CHANGED',changed)
          PY
      - name: Validate
        shell: bash
        run: |
          python3 -m json.tool data/seed.json >/dev/null
          node --check server.js
          node --check public/app.js
          node --check public/predictions.js
          node --check public/ai-analysis.js
          npm test
          git diff --check
          if ! git diff --quiet -- public/assets/teams-normal; then
            echo 'ERROR: teams-normal changed unexpectedly' >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          d=json.load(open('data/seed.json'))
          hits=[]
          for m in d['matches']:
              if m.get('startsAt','').startswith(('2026-08-21T18:20','2026-08-21T20:30','2026-08-22T10:00')) and '主赛事' in m.get('stage',''):
                  hits.append((m['id'],m['startsAt'],[x['name'] for x in m['teams']],m['source']))
          print('VERIFY_HITS',hits)
          assert any(x[1].startswith('2026-08-21T18:20') and set(x[2])=={'Team Spirit','Team VISION'} for x in hits)
          assert any(x[1].startswith('2026-08-21T20:30') and set(x[2])=={'Team Yandex','Nigma Galaxy'} for x in hits)
          assert any(x[1].startswith('2026-08-22T10:00') and 'Team Liquid' in x[2] for x in hits)
          PY
      - name: Commit and clean temporary workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/ti-sync-apply-now.yml .github/workflows/ti-sync-inspect-now.yml
          git add data/seed.json .github/workflows/ti-sync-apply-now.yml .github/workflows/ti-sync-inspect-now.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Sync latest TI2026 Aug 21-22 schedule updates"
          git push

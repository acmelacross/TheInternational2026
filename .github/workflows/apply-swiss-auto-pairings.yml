name: Apply Swiss auto pairings

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-swiss-auto-pairings.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply patch
        run: python3 scripts/patch-swiss-auto-pairings.py
      - name: Validate
        run: |
          node --check server.js
          node --check public/app.js
          grep -q 'fetchOpenDotaLive' server.js
          grep -q 'hydrateSwissPlaceholders' server.js
          grep -q 'openDotaLiveCount' server.js
      - name: Commit result
        run: |
          rm -f .github/workflows/apply-swiss-auto-pairings.yml scripts/patch-swiss-auto-pairings.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto-fill Swiss pairings from OpenDota live data"
          git push

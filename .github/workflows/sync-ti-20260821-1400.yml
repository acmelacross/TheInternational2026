name: Sync TI2026 Aug 21 schedule time

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-ti-20260821-1400.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch confirmed BLAST time
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path('data/seed.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          changed = 0
          matched = 0
          for m in data.get('matches', []):
              names = [t.get('name') for t in m.get('teams', [])[:2]]
              if set(names) == {'Team Liquid', 'Team Falcons'} and str(m.get('startsAt','')).startswith('2026-08-21T'):
                  matched += 1
                  if m.get('startsAt') != '2026-08-21T13:30:00+08:00':
                      m['startsAt'] = '2026-08-21T13:30:00+08:00'
                      changed += 1

          def replace_text(obj):
              global changed
              if isinstance(obj, dict):
                  for k,v in list(obj.items()):
                      if isinstance(v, str) and '13:00 Team Liquid vs Team Falcons' in v:
                          obj[k] = v.replace('13:00 Team Liquid vs Team Falcons', '13:30 Team Liquid vs Team Falcons')
                          changed += 1
                      else:
                          replace_text(v)
              elif isinstance(obj, list):
                  for v in obj: replace_text(v)
          replace_text(data.get('timeline', []))

          if matched == 0:
              raise SystemExit('Expected Aug 21 Team Liquid vs Team Falcons match not found')
          if changed == 0:
              raise SystemExit('No change needed: repository already has 13:30')
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'patched matches={matched}, changes={changed}')
          PY

      - name: Validate
        shell: bash
        run: |
          python3 -m json.tool data/seed.json >/dev/null
          node --check server.js
          node --check public/app.js
          node --check public/predictions.js
          node --check public/ai-analysis.js
          npm test
          git diff --check
          if git diff --name-only | grep -q '^public/assets/teams-normal/'; then
            echo 'ERROR: team logo directory changed'
            exit 1
          fi
          git diff -- data/seed.json

      - name: Commit verified change and clean temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/sync-ti-20260821-1400.yml
          git add -- data/seed.json
          git commit -m 'Correct TI2026 Aug 21 Liquid vs Falcons time'
          git push origin main

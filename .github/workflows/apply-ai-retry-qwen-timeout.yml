name: Apply AI retry and Qwen timeout fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-ai-retry-qwen-timeout.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply patch
        run: python3 scripts/patch-ai-retry-qwen-timeout.py
      - name: Validate
        run: |
          node --check ai-service.js
          node --check server.js
          node --check public/ai-analysis.js
          grep -q "qwen-json-v3-20260813" ai-service.js
          grep -q "timeoutMs:270000" ai-service.js
          grep -q "max_completion_tokens:8192" ai-service.js
          grep -q "retryProvider" ai-service.js
          grep -q "/api/ai/retry" server.js
          grep -q "data-ai-retry" public/ai-analysis.js
      - name: Commit result
        run: |
          rm -f .github/workflows/apply-ai-retry-qwen-timeout.yml scripts/patch-ai-retry-qwen-timeout.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add failed AI retry and fix Qwen timeout"
          git push

name: Sync TI 2120
on:
  push:
    paths: ['.github/workflows/sync-ti-2120.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update published start time
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/seed.json')
          d=json.loads(p.read_text())
          byid={m.get('id'):m for m in d.get('matches',[])}
          for mid in ('seed-me-ubqf4','seed-main-0820-ubqf4'):
              m=byid[mid]
              assert [t.get('name') for t in m['teams'][:2]]==['Nigma Galaxy','Team Falcons']
              m['startsAt']='2026-08-20T21:20:00+08:00'
              m['source']='liquipedia-mediawiki-published'
          for item in d.get('timeline',[]):
              for key in ('detail','note','summary','description'):
                  v=item.get(key)
                  if isinstance(v,str): item[key]=v.replace('21:15 Nigma Galaxy vs Team Falcons','21:20 Nigma Galaxy vs Team Falcons')
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Validate
        run: |
          python3 -m json.tool data/seed.json >/dev/null
          node --check server.js
          node --check public/app.js
          node --check public/predictions.js
          node --check public/ai-analysis.js
          npm test
          git diff --check
          git diff --quiet -- public/assets/teams-normal || exit 1
      - name: Commit and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/sync-ti-2120.yml
          git add -A
          git commit -m 'Correct TI2026 Nigma vs Falcons start time'
          git push

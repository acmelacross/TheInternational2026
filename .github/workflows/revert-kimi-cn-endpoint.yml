name: Restore Kimi CN endpoint

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/revert-kimi-cn-endpoint.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Restore CN endpoint without bumping cache revision
        shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('ai-service.js'); s=p.read_text(encoding='utf-8'); a=s.index('function kimiBaseUrl() {'); b=s.index('function envFirst', a); s=s[:a]+\"function kimiBaseUrl() {\\n  return cleanBase(envFirst('KIMI_BASE_URL') || 'https://api.moonshot.cn/v1');\\n}\\n\"+s[b:]; p.write_text(s, encoding='utf-8')"
      - name: Validate
        run: |
          node --check ai-service.js
          grep -q "https://api.moonshot.cn/v1" ai-service.js
          grep -q "kimi-k3-global-v5-20260813" ai-service.js
      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/revert-kimi-cn-endpoint.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore Kimi China API endpoint"
          git push

name: Sync TI2026 Aug 22 Spirit Liquid time
on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync_aug22_spirit_liquid_time.py'
      - '.github/workflows/sync-aug22-spirit-liquid-time.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Apply schedule correction
        run: python3 scripts/sync_aug22_spirit_liquid_time.py
      - name: Validate
        run: |
          python3 -m json.tool data/seed.json >/dev/null
          node --check server.js
          node --check public/app.js
          node --check public/predictions.js
          node --check public/ai-analysis.js
          npm test
          git diff --check
          if ! git diff --quiet -- public/assets/teams-normal; then
            echo 'team logo directory changed unexpectedly' >&2
            exit 1
          fi
      - name: Commit verified update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/sync_aug22_spirit_liquid_time.py .github/workflows/sync-aug22-spirit-liquid-time.yml
          git add data/seed.json
          git commit -m 'Correct TI2026 Aug 22 Spirit vs Liquid time'
          git push

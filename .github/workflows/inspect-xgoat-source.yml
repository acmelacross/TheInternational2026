name: Inspect xgoat schedule source
on:
  push:
    branches: [main]
    paths:
      - 'scripts/inspect_xgoat_source.py'
      - '.github/workflows/inspect-xgoat-source.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Inspect xgoat source
        run: python3 scripts/inspect_xgoat_source.py

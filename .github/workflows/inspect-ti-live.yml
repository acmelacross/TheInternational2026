name: Inspect TI live schedule
on:
  push:
    paths:
      - '.github/workflows/inspect-ti-live.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch fresh structured schedule
        run: |
          python3 - <<'PY'
          import json, urllib.request
          u='https://ti.xgoat.top/api/schedule/wiki?year=2026'
          req=urllib.request.Request(u,headers={'User-Agent':'TI2026-Sync/1.0','Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=25) as r:
              data=json.load(r)
          print('META',json.dumps({k:data.get(k) for k in ['source','fetchedAt','revisionAt','revisionId','stale','coverage']},ensure_ascii=False))
          rows=[]
          for st in data.get('stages',[]):
              for rd in st.get('rounds',[]) or []:
                  for m in rd.get('matches',[]) or []:
                      t=m.get('scheduledAt','')
                      if t.startswith('2026-08-22') or t.startswith('2026-08-23'):
                          rows.append({'stage':st.get('label') or st.get('id'),'round':rd.get('title') or rd.get('id'),'id':m.get('id'),'scheduledAt':t,'status':m.get('status'),'bestOf':m.get('bestOf'),'opponents':m.get('opponents')})
          for x in rows:
              print('MATCH',json.dumps(x,ensure_ascii=False,separators=(',',':')))
          PY

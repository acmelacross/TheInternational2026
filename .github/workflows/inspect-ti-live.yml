name: Inspect TI live schedule
on:
  push:
    paths:
      - '.github/workflows/inspect-ti-live.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch fresh structured schedule and persist snapshot
        run: |
          python3 - <<'PY' > ti-live-inspect.txt
          import json, urllib.request
          u='https://ti.xgoat.top/api/schedule/wiki?year=2026'
          req=urllib.request.Request(u,headers={'User-Agent':'TI2026-Sync/1.0','Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=25) as r: data=json.load(r)
          print('META',json.dumps({k:data.get(k) for k in ['source','fetchedAt','revisionAt','revisionId','stale','coverage']},ensure_ascii=False))
          for st in data.get('stages',[]):
            for rd in st.get('rounds',[]) or []:
              for m in rd.get('matches',[]) or []:
                t=m.get('scheduledAt','')
                if t.startswith('2026-08-22') or t.startswith('2026-08-23'):
                  print('MATCH',json.dumps({'stage':st.get('label') or st.get('id'),'round':rd.get('title') or rd.get('id'),'id':m.get('id'),'scheduledAt':t,'status':m.get('status'),'bestOf':m.get('bestOf'),'opponents':m.get('opponents')},ensure_ascii=False,separators=(',',':')))
          PY
          cat ti-live-inspect.txt
      - name: Commit snapshot and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/inspect-ti-live.yml
          git add ti-live-inspect.txt
          git commit -m 'Capture fresh TI live schedule snapshot'
          git push

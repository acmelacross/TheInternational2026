name: Sync TI2026 UBQF2 time

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-ti-0820-ubqf2-time.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch confirmed BLAST time
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/seed.json')
          data=json.loads(p.read_text())
          ids={'seed-me-ubqf2','seed-main-0820-ubqf2'}
          touched=[]
          for m in data.get('matches',[]):
              if m.get('id') in ids:
                  old=m.get('startsAt')
                  m['startsAt']='2026-08-20T13:45:00+08:00'
                  touched.append((m.get('id'),old,m['startsAt']))
          if {x[0] for x in touched} != ids:
              raise SystemExit(f'expected both UBQF2 entries, got {touched}')
          def rewrite(v):
              if isinstance(v,dict): return {k:rewrite(x) for k,x in v.items()}
              if isinstance(v,list): return [rewrite(x) for x in v]
              if isinstance(v,str):
                  return (v.replace('13:00 TEAM VISION vs BoomBoys','13:45 TEAM VISION vs BoomBoys')
                           .replace('13:00 TEAM VISION 对 BoomBoys','13:45 TEAM VISION 对 BoomBoys')
                           .replace('13:00 TEAM VISION vs BoomBoys/BetBoom','13:45 TEAM VISION vs BoomBoys/BetBoom'))
              return v
          data=rewrite(data)
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          print(touched)
          PY
      - name: Validate JSON and JS
        run: |
          python3 -m json.tool data/seed.json >/dev/null
          node --check server.js
          node --check public/app.js
          node --check public/predictions.js
          node --check public/ai-analysis.js
          npm test
          git diff --check
      - name: Protect manual team logos
        run: |
          if git diff --name-only HEAD | grep -q '^public/assets/teams-normal/'; then
            echo 'Refusing to modify manually maintained team logos'
            exit 1
          fi
      - name: Verify exact schedule change
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('data/seed.json'))
          rows={m['id']:m for m in d['matches'] if m.get('id') in {'seed-me-ubqf2','seed-main-0820-ubqf2'}}
          assert len(rows)==2, rows
          for m in rows.values():
              assert m['startsAt']=='2026-08-20T13:45:00+08:00',m
              assert [t['name'] for t in m['teams']]==['Team VISION','BoomBoys'],m
              assert m['status']=='upcoming',m
          print('UBQF2_TIME_OK')
          PY
      - name: Commit verified sync and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/sync-ti-0820-ubqf2-time.yml
          git add -- data/seed.json
          git commit -m "Correct TI2026 Aug 20 UBQF2 start time"
          git push

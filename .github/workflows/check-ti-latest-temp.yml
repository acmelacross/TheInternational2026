name: Check TI latest temp
on:
  push:
    paths:
      - '.github/workflows/check-ti-latest-temp.yml'
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch reliable public sources
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re, urllib.request, pathlib
          urls={
            'xgoat':'https://ti.xgoat.top/api/schedule/wiki?year=2026',
            'liquipedia':'https://liquipedia.net/dota2/The_International/2026',
            'blast':'https://blast.tv/dota/tournaments/the-international-2026/series',
            'dota2':'https://www.dota2.com/esports/ti15',
            'pw':'https://www.dota2.com.cn/international2026'
          }
          hdr={'User-Agent':'Mozilla/5.0 TI2026Guide/1.4.2','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'}
          out={}
          for k,u in urls.items():
            try:
              req=urllib.request.Request(u,headers=hdr)
              with urllib.request.urlopen(req,timeout=25) as r:
                b=r.read().decode('utf-8','replace')
                rec={'status':r.status,'contentType':r.headers.get('content-type'),'length':len(b)}
                if k=='xgoat':
                  d=json.loads(b)
                  rec['meta']={x:d.get(x) for x in ['source','fetchedAt','revisionAt','revisionId','stale','coverage']}
                  ms=[]
                  for st in d.get('stages',[]):
                    for rd in st.get('rounds',[]):
                      for m in rd.get('matches',[]):
                        at=str(m.get('scheduledAt',''))
                        if at >= '2026-08-19':
                          ms.append({'stage':st.get('label'),'round':rd.get('title'),'scheduledAt':at,'status':m.get('status'),'bestOf':m.get('bestOf'),'opponents':[{'name':o.get('name'),'score':o.get('score')} for o in m.get('opponents',[])[:2]]})
                  rec['matches']=ms
                else:
                  text=re.sub(r'\s+',' ',b)
                  hits=[]
                  for needle in ['Aug 20','August 20','2026-08-20','Iron Wing','Team Spirit','PARIVISION','Team Liquid','Team Yandex','Nigma Galaxy','Team Falcons','Lower Bracket','Upper Bracket']:
                    i=text.lower().find(needle.lower())
                    if i>=0:
                      hits.append({'needle':needle,'snippet':text[max(0,i-300):i+900]})
                  rec['hits']=hits[:8]
                out[k]=rec
            except Exception as e:
              out[k]={'error':repr(e)}
          pathlib.Path('.ti-latest-check.json').write_text(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Persist temporary result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .ti-latest-check.json
          git commit -m "Temporary TI latest check result" || exit 0
          git push

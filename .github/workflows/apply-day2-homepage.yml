name: Apply Day 2 homepage refresh
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-day2-homepage.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply patch
        run: python3 scripts/patch-day2-homepage.py
      - name: Validate
        run: |
          node --check public/app.js
          node --check public/predictions.js
          python3 -m json.tool data/seed.json >/dev/null
          grep -q '今日 / 明日赛程' public/index.html
          grep -q 'tomorrowMatches' public/index.html
          grep -q 'updateTIPredictions' public/app.js
          grep -q 'DAY1_SNAPSHOT' public/predictions.js
          ! grep -q 'id="calendarSection"' public/index.html
      - name: Commit result
        run: |
          rm -f .github/workflows/apply-day2-homepage.yml scripts/patch-day2-homepage.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh Day 2 schedule and power rankings"
          git push

name: Sync TI2026 Aug 20 schedule times

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-ti2026-aug20-times.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch confirmed BLAST times
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path('data/seed.json')
          data = json.loads(p.read_text())

          target_ids = {
              'seed-me-ubqf3': '2026-08-20T18:00:00+08:00',
              'seed-main-0820-ubqf3': '2026-08-20T18:00:00+08:00',
              'seed-me-ubqf4': '2026-08-20T20:30:00+08:00',
              'seed-main-0820-ubqf4': '2026-08-20T20:30:00+08:00',
          }
          seen = set()
          for m in data.get('matches', []):
              mid = m.get('id')
              if mid in target_ids:
                  m['startsAt'] = target_ids[mid]
                  m['source'] = 'blast'
                  seen.add(mid)
          missing = set(target_ids) - seen
          if missing:
              raise SystemExit(f'missing match ids: {sorted(missing)}')

          for item in data.get('timeline', []):
              if item.get('date') == '2026-08-20':
                  item['detail'] = '主赛事 Day 1：10:30 Iron Wing 0:2 Team Spirit 已结束；13:45 TEAM VISION vs BoomBoys 正在进行；18:00 Team Liquid vs Team Yandex；20:30 Nigma Galaxy vs Team Falcons。进行中比分不写死，比分与后续对阵仅按可靠数据源明确发布的信息更新。'
                  break
          else:
              raise SystemExit('missing 2026-08-20 timeline')

          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Validate
        run: |
          python3 -m json.tool data/seed.json >/dev/null
          node --check server.js
          node --check public/app.js
          node --check public/predictions.js
          node --check public/ai-analysis.js
          npm test
          git diff --check
          if ! git diff --quiet -- public/assets/teams-normal; then
            echo 'ERROR: public/assets/teams-normal changed' >&2
            exit 1
          fi

      - name: Commit verified update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/sync-ti2026-aug20-times.yml
          git add -- data/seed.json
          git commit -m 'Correct TI2026 Aug 20 late match times'
          git push origin main

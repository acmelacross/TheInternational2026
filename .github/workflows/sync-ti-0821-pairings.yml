name: Sync TI2026 Aug 21 pairings

on:
  push:
    paths:
      - '.github/workflows/sync-ti-0821-pairings.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update confirmed pairings
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/seed.json')
          data=json.loads(p.read_text())
          updates={
            'seed-main-0821-lbr1-2': {
              'teams':[{'name':'Team Liquid','score':None},{'name':'Team Falcons','score':None}],
              'status':'upcoming','source':'blast-published'
            },
            'seed-main-0821-ubsf2': {
              'teams':[{'name':'Team Yandex','score':None},{'name':'Nigma Galaxy','score':None}],
              'status':'upcoming','source':'blast-published'
            },
          }
          found=set()
          for m in data.get('matches',[]):
              if m.get('id') in updates:
                  m.update(updates[m['id']]); found.add(m['id'])
          missing=set(updates)-found
          if missing: raise SystemExit(f'missing match ids: {sorted(missing)}')
          for item in data.get('timeline',[]):
              if item.get('date')=='2026-08-21':
                  item['detail']='主赛事 Day 2 已明确四场对阵：10:00 Iron Wing vs BoomBoys、13:00 Team Liquid vs Team Falcons、16:00 Team Spirit vs TEAM VISION、19:00 Team Yandex vs Nigma Galaxy。'
                  item['note']='仅同步可靠公开数据源已经明确发布的对阵与时间；不根据胜负关系自行推算后续轮次。'
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Validate
        run: |
          python3 -m json.tool data/seed.json >/dev/null
          node --check server.js
          node --check public/app.js
          node --check public/predictions.js
          node --check public/ai-analysis.js
          npm test
          git diff --check
          if ! git diff --quiet -- public/assets/teams-normal; then
            echo 'ERROR: team logo directory changed'
            git diff -- public/assets/teams-normal
            exit 1
          fi
      - name: Commit verified update and clean workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/sync-ti-0821-pairings.yml
          git add data/seed.json
          git commit -m "Sync confirmed TI2026 Aug 21 pairings"
          git push

name: Validate TI2026 v1.3.3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/validate-v133.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax checks
        run: |
          node --check server.js
          node --check public/app.js
          node --check public/match.js
          node --check public/predictions.js
      - name: Existing project tests
        run: node tests.js
      - name: Verify v1.3.3 files and user logo cache
        run: |
          test "$(cat VERSION)" = "1.3.3"
          test -f public/v133.css
          test -f public/predictions.js
          test -d public/assets/teams-normal
          test "$(find public/assets/teams-normal -maxdepth 1 -type f -name '*.png' | wc -l)" -ge 16
          grep -q "TI2026潍坊线下观赛指南" public/index.html
          grep -q "predictionSection" public/index.html
          grep -q "不建议、不支持任何形式的菠菜或博彩行为" public/index.html
      - name: Remove one-time validation workflow
        run: rm -f .github/workflows/validate-v133.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Complete v1.3.3 validation"
          git push

name: Inspect TI schedule now
on:
  push:
    paths:
      - '.github/workflows/inspect-ti-schedule-now.yml'
      - 'scripts/inspect_ti_schedule_now.py'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch current structured schedule
        run: python3 scripts/inspect_ti_schedule_now.py > ti-current-auto.txt
      - name: Commit temporary snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ti-current-auto.txt
          git commit -m "Capture current TI schedule snapshot" || exit 0
          git push

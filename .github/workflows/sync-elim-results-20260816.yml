name: Sync TI2026 elimination results
on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync_elim_results_20260816.py'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Apply confirmed results
        run: python3 scripts/sync_elim_results_20260816.py
      - name: Validate
        run: |
          python3 -m json.tool data/seed.json >/dev/null
          node --check server.js
          node --check public/app.js
          node --check public/predictions.js
          node --check public/ai-analysis.js
          npm test
          git diff --check
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/sync_elim_results_20260816.py .github/workflows/sync-elim-results-20260816.yml
          git add data/seed.json
          git commit -m 'Sync confirmed TI2026 elimination results'
          git push

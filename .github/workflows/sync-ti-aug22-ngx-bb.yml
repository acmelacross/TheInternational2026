name: Sync TI2026 Aug 22 Nigma vs BoomBoys result
on:
  push:
    paths:
      - '.github/workflows/sync-ti-aug22-ngx-bb.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch confirmed result
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/seed.json')
          d=json.loads(p.read_text())
          changed=0
          wanted={'Nigma Galaxy','BoomBoys'}
          for m in d.get('matches',[]):
              if not str(m.get('startsAt','')).startswith('2026-08-22'):
                  continue
              names=[t.get('name') for t in m.get('teams',[])[:2]]
              if set(names)!=wanted:
                  continue
              for t in m['teams']:
                  t['score']=1 if t.get('name')=='Nigma Galaxy' else 2
                  t['winner']=t.get('name')=='BoomBoys'
              m['status']='finished'
              m['source']='liquipedia-confirmed-result'
              changed += 1
          if changed < 1:
              raise SystemExit('No matching Aug 22 Nigma Galaxy vs BoomBoys seed match found')
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2)+'\n')
          print('updated matches:', changed)
          PY
      - name: Validate
        run: |
          python3 -m json.tool data/seed.json >/dev/null
          node --check server.js
          node --check public/app.js
          node --check public/predictions.js
          node --check public/ai-analysis.js
          npm test
          git diff --check
          if ! git diff --quiet -- public/assets/teams-normal; then
            echo 'ERROR: public/assets/teams-normal changed' >&2
            exit 1
          fi
      - name: Commit verified update and cleanup workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/sync-ti-aug22-ngx-bb.yml
          git add data/seed.json
          git commit -m 'Sync confirmed TI2026 Nigma vs BoomBoys result'
          git push

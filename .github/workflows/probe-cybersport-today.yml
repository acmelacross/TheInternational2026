name: Probe Cybersport TI2026 today
on:
  push:
    paths:
      - '.github/workflows/probe-cybersport-today.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract current today schedule
        run: |
          python3 - <<'PY'
          import urllib.request,re,html
          u='https://www.cybersport.ru/tournaments/dota-2/the-international-2026'
          req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 TI2026Guide/1.3','Accept-Language':'ru-RU,ru;q=0.9,en;q=0.8'})
          raw=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','ignore')
          # Decode escaped unicode/html enough for visible SSR text.
          try: decoded=bytes(raw,'utf-8').decode('unicode_escape')
          except: decoded=raw
          text=html.unescape(re.sub(r'<[^>]+>',' ',decoded)); text=re.sub(r'\s+',' ',text)
          print('bytes',len(raw))
          for needle in ['Сегодня в','Team Spirit','PARIVISION','Team Resilience','Yandex','Falcons','GamerLegion','LGD','Xtreme','OG','L1ga','Nigma','Vici','BetBoom','Aurora','Iron Wing','Team Liquid']:
            print('\n###',needle)
            hs=list(re.finditer(re.escape(needle),text,re.I)); print('count',len(hs))
            for m in hs[-20:]:
              s=text[max(0,m.start()-300):min(len(text),m.end()+500)]
              if 'Сегодня' in s or needle=='Сегодня в': print(s)
          # Raw JSON-ish substrings around today's date and swiss labels.
          print('\n### RAW 2026-08-15 contexts')
          for m in list(re.finditer('2026-08-15',raw))[-30:]: print(raw[max(0,m.start()-1200):min(len(raw),m.end()+2200)].replace('\\u002F','/')[:3400])
          PY
      - name: Cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/probe-cybersport-today.yml
          git commit -m "Remove one-time Cybersport schedule probe"
          git push

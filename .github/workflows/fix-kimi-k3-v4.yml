name: Fix Kimi K3 official structured output

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-kimi-k3-v4.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Patch Kimi K3 to official structured output
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ai-service.js')
          s = p.read_text(encoding='utf-8')

          old_rev = "kimi:'kimi-k3-json-v3-20260813'"
          new_rev = "kimi:'kimi-k3-schema-v4-20260813'"
          if old_rev not in s:
              raise SystemExit('Kimi v3 cache revision marker not found')
          s = s.replace(old_rev, new_rev, 1)

          marker = "function providerRevision(p){ return FORMAT_REVISIONS[p.id] || ANALYSIS_REVISION; }\n"
          schema = r'''function providerRevision(p){ return FORMAT_REVISIONS[p.id] || ANALYSIS_REVISION; }
const KIMI_RESPONSE_FORMAT = {
  type:'json_schema',
  json_schema:{
    name:'ti2026_analysis',
    strict:true,
    schema:{
      type:'object',
      properties:{
        winnerLean:{type:'string'},
        confidence:{type:'integer',minimum:0,maximum:100},
        scorePrediction:{type:'string'},
        summary:{type:'string'},
        keyReasons:{type:'array',items:{type:'string'}},
        watchPoints:{type:'array',items:{type:'string'}},
        risks:{type:'string'},
        gamePredictions:{
          type:'array',
          items:{
            type:'object',
            properties:{
              game:{type:'integer'},
              winnerLean:{type:'string'},
              confidence:{type:'integer',minimum:0,maximum:100},
              reason:{type:'string'},
              bpKey:{type:'string'},
              playerKey:{type:'string'},
              status:{type:'string',enum:['prediction','observed','likely_not_needed']}
            },
            required:['game','winnerLean','confidence','reason','bpKey','playerKey','status'],
            additionalProperties:false
          }
        },
        playerForm:{type:'array',items:{type:'string'}},
        bpAnalysis:{type:'array',items:{type:'string'}},
        relationshipContext:{type:'array',items:{type:'string'}},
        dataGaps:{type:'array',items:{type:'string'}}
      },
      required:['winnerLean','confidence','scorePrediction','summary','keyReasons','watchPoints','risks','gamePredictions','playerForm','bpAnalysis','relationshipContext','dataGaps'],
      additionalProperties:false
    }
  }
};
'''
          if 'const KIMI_RESPONSE_FORMAT' not in s:
              if marker not in s:
                  raise SystemExit('providerRevision marker not found')
              s = s.replace(marker, schema, 1)

          old_provider = "{ id:'kimi', name:'Kimi K3', vendor:'Moonshot AI', api:'chat', key:envFirst('KIMI_API_KEY','MOONSHOT_API_KEY'), model:envFirst('KIMI_MODEL')||'kimi-k3', baseUrl:cleanBase(envFirst('KIMI_BASE_URL')||'https://api.moonshot.cn/v1'), timeoutMs:280000, body:{ reasoning_effort:'low', response_format:{type:'json_object'}, max_tokens:undefined, max_completion_tokens:16384 } },"
          new_provider = "{ id:'kimi', name:'Kimi K3', vendor:'Moonshot AI', api:'chat', key:envFirst('KIMI_API_KEY','MOONSHOT_API_KEY'), model:envFirst('KIMI_MODEL')||'kimi-k3', baseUrl:cleanBase(envFirst('KIMI_BASE_URL')||'https://api.moonshot.cn/v1'), timeoutMs:280000, body:{ reasoning_effort:'low', response_format:KIMI_RESPONSE_FORMAT, max_tokens:undefined } },"
          if old_provider not in s:
              raise SystemExit('Kimi v3 provider definition not found')
          s = s.replace(old_provider, new_provider, 1)

          old_empty = "const text=extractText(json); if(!text){const finish=json?.choices?.[0]?.finish_reason||json?.status||'unknown';const hasReasoning=Boolean(json?.choices?.[0]?.message?.reasoning_content);throw new Error(`${p.vendor} 返回成功但没有最终文本内容（finish_reason=${finish}${hasReasoning?'，存在 reasoning_content':''}）`);}"
          new_empty = "const text=extractText(json); if(!text){const choice=json?.choices?.[0],msg=choice?.message;const finish=choice?.finish_reason||json?.status||'unknown';const shape={topKeys:json&&typeof json==='object'?Object.keys(json).slice(0,12):[],choiceCount:Array.isArray(json?.choices)?json.choices.length:null,choiceKeys:choice&&typeof choice==='object'?Object.keys(choice).slice(0,12):[],messageKeys:msg&&typeof msg==='object'?Object.keys(msg).slice(0,12):[],contentType:Array.isArray(msg?.content)?'array':typeof msg?.content,contentLength:typeof msg?.content==='string'?msg.content.length:null,reasoningLength:typeof msg?.reasoning_content==='string'?msg.reasoning_content.length:null};throw new Error(`${p.vendor} 返回成功但没有最终文本内容（finish_reason=${finish}；响应结构=${redact(JSON.stringify(shape))}）`);}"
          if old_empty not in s:
              raise SystemExit('empty-output diagnostic marker not found')
          s = s.replace(old_empty, new_empty, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate
        run: |
          node --check ai-service.js
          grep -q "kimi-k3-schema-v4-20260813" ai-service.js
          grep -q "type:'json_schema'" ai-service.js
          grep -q "strict:true" ai-service.js
          grep -q "response_format:KIMI_RESPONSE_FORMAT" ai-service.js
          ! grep -q "max_completion_tokens:16384" ai-service.js

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/fix-kimi-k3-v4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Kimi K3 with official strict JSON schema"
          git push

name: Fix Kimi K3 official structured output

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-kimi-k3-v4.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply Kimi K3 v4 patch
        run: node scripts/apply-kimi-v4.js
      - name: Validate
        run: |
          node --check ai-service.js
          grep -q "kimi-k3-schema-v4-20260813" ai-service.js
          grep -q "type:'json_schema'" ai-service.js
          grep -q "strict:true" ai-service.js
          grep -q "response_format:KIMI_RESPONSE_FORMAT" ai-service.js
          ! grep -q "max_completion_tokens:16384" ai-service.js
      - name: Remove one-time files and commit
        run: |
          rm -f scripts/apply-kimi-v4.js
          rm -f .github/workflows/fix-kimi-k3-v4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Kimi K3 with official strict JSON schema"
          git push

name: Verify latest TI2026 result
on:
  push:
    paths:
      - '.github/workflows/ti-sync-current.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and sync
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request, pathlib, re
          url='https://ti.xgoat.top/api/schedule/wiki?year=2026'
          req=urllib.request.Request(url,headers={'User-Agent':'TI2026-Viewing-Guide/automation','Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=25) as r:
              data=json.load(r)
          print('META', json.dumps({k:data.get(k) for k in ['source','revisionAt','revisionId','stale']},ensure_ascii=False))
          found=[]
          for st in data.get('stages',[]):
              for rd in st.get('rounds',[]):
                  for m in rd.get('matches',[]):
                      names=[o.get('name') for o in m.get('opponents',[])[:2]]
                      if set(names)=={'Team Spirit','Team Liquid'} and str(m.get('scheduledAt','')).startswith('2026-08-22'):
                          found.append(m)
          print('FOUND',json.dumps(found,ensure_ascii=False))
          if not found:
              raise SystemExit('No Aug 22 Spirit-Liquid match in XGoat; no sync')
          m=found[-1]
          ops=m.get('opponents',[])[:2]
          scores={o.get('name'):o.get('score') for o in ops}
          if str(m.get('status','')).lower()!='finished' or scores.get('Team Spirit')!=2 or scores.get('Team Liquid')!=1:
              raise SystemExit('XGoat has not confirmed finished 2:1; no sync')
          p=pathlib.Path('data/seed.json')
          seed=json.loads(p.read_text())
          changed=0
          for x in seed.get('matches',[]):
              if not str(x.get('startsAt','')).startswith('2026-08-22'): continue
              ts=[t.get('name') for t in x.get('teams',[])[:2]]
              if set(ts)!={'Team Spirit','Team Liquid'}: continue
              for t in x['teams']:
                  t['score']=scores.get(t.get('name'))
                  t['winner']=t.get('name')=='Team Spirit'
              x['status']='finished'
              x['source']='xgoat-liquipedia-confirmed-result'
              changed+=1
          for item in seed.get('timeline',[]):
              if str(item.get('date',''))=='2026-08-22':
                  for k,v in list(item.items()):
                      if isinstance(v,str) and 'Team Spirit vs Team Liquid' in v:
                          item[k]=v.replace('Team Spirit vs Team Liquid','Team Spirit 2:1 Team Liquid')
          if changed==0:
              raise SystemExit('Seed does not contain target match; no sync')
          p.write_text(json.dumps(seed,ensure_ascii=False,indent=2)+'\n')
          print('PATCHED_MATCHES',changed)
          PY
          python3 -m json.tool data/seed.json >/dev/null
          node --check server.js
          node --check public/app.js
          node --check public/predictions.js
          node --check public/ai-analysis.js
          npm test
          git diff --check
          if git diff --name-only -- public/assets/teams-normal | grep -q .; then
            echo 'Logo directory changed unexpectedly' >&2; exit 1
          fi
      - name: Commit verified result and cleanup
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/ti-sync-current.yml
          git add data/seed.json
          git commit -m 'Sync confirmed TI2026 Spirit vs Liquid result'
          git push

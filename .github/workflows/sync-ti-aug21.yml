name: Sync TI2026 Aug 21 schedule
on:
  push:
    paths:
      - '.github/workflows/sync-ti-aug21.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Patch confirmed Aug 21 pairings
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/seed.json')
          d=json.loads(p.read_text())
          changed=[]
          for m in d.get('matches',[]):
              mid=m.get('id')
              if mid=='seed-me-lbr1-2':
                  names=[t.get('name') for t in m.get('teams',[])[:2]]
                  if names!=['Team Liquid','Team Falcons']:
                      m['teams']=[{'name':'Team Liquid','score':None},{'name':'Team Falcons','score':None}]
                      m['status']='upcoming'
                      m['source']='published-schedule'
                      changed.append(mid)
              elif mid=='seed-me-ubsf2':
                  names=[t.get('name') for t in m.get('teams',[])[:2]]
                  if names!=['Team Yandex','Nigma Galaxy']:
                      m['teams']=[{'name':'Team Yandex','score':None},{'name':'Nigma Galaxy','score':None}]
                      m['status']='upcoming'
                      m['source']='published-schedule'
                      changed.append(mid)
          # Keep timeline factual and in sync when an Aug 21 entry exists.
          for item in d.get('timeline',[]):
              if str(item.get('date','')).startswith('2026-08-21'):
                  item['title']='主赛事 Day 2'
                  item['note']='10:00 Iron Wing vs BoomBoys；13:00 Team Liquid vs Team Falcons；16:00 Team Spirit vs TEAM VISION；19:00 Team Yandex vs Nigma Galaxy。其余后续对阵等待可靠数据源正式发布。'
          if not changed:
              raise SystemExit('No seed match changes needed; aborting to avoid empty sync commit')
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          print('changed',changed)
          PY
      - name: Validate
        shell: bash
        run: |
          python3 -m json.tool data/seed.json >/dev/null
          node --check server.js
          node --check public/app.js
          node --check public/predictions.js
          node --check public/ai-analysis.js
          npm test
          git diff --check
          if git diff --name-only | grep -q '^public/assets/teams-normal/'; then
            echo 'ERROR: team logos changed unexpectedly' >&2
            exit 1
          fi
      - name: Commit verified sync
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/sync-ti-aug21.yml
          git add data/seed.json
          git commit -m 'Sync confirmed TI2026 Aug 21 pairings'
          git push

name: Fix LGD schedule source alias
on:
  push:
    paths:
      - '.github/workflows/fix-lgd-schedule-alias.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add LGD alias
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('server.js'); s=p.read_text()
          old="['l1ga', 'HULIGANI'], ['l1gateam', 'HULIGANI'],"
          new="['l1ga', 'HULIGANI'], ['l1gateam', 'HULIGANI'], ['lgd', 'LGD Gaming'],"
          assert old in s; p.write_text(s.replace(old,new,1))
          p=Path('public/app.js'); s=p.read_text()
          old="'l1ga': 'HULIGANI', 'l1ga team': 'HULIGANI', 'aurora': 'Aurora Gaming',"
          new="'l1ga': 'HULIGANI', 'l1ga team': 'HULIGANI', 'lgd': 'LGD Gaming', 'aurora': 'Aurora Gaming',"
          assert old in s; p.write_text(s.replace(old,new,1))
          PY
          node --check server.js
          node --check public/app.js
      - name: Verify no duplicate Aug15 named matches
        run: |
          rm -rf /tmp/ti2026-alias-check
          DATA_DIR=/tmp/ti2026-alias-check PORT=17830 node server.js >/tmp/ti2026-alias.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:17830/api/health >/dev/null && break; sleep 1; done
          curl -fsS --max-time 75 -X POST http://127.0.0.1:17830/api/refresh -o /tmp/alias-payload.json
          python3 - <<'PY'
          import json
          from datetime import datetime,timezone,timedelta
          d=json.load(open('/tmp/alias-payload.json')); sh=timezone(timedelta(hours=8)); rows=[]
          for m in d['matches']:
            dt=datetime.fromisoformat(m['startsAt'].replace('Z','+00:00')).astimezone(sh)
            names=tuple(sorted(t.get('name','') for t in m.get('teams',[])))
            if dt.date().isoformat()=='2026-08-15' and '待定' not in names: rows.append((dt.strftime('%H:%M'),names))
          print(rows)
          assert len(rows)==len(set(rows)), rows
          assert len([x for x in rows if x[0] in ('10:00','13:00')])==8, rows
          print('NO_DUPLICATE_SCHEDULE_OK')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-lgd-schedule-alias.yml
          git add server.js public/app.js
          git commit -m "Normalize LGD across schedule sources"
          git push

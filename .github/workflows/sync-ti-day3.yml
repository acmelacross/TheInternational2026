name: Sync confirmed TI2026 Day 3 schedule
on:
  push:
    paths:
      - '.github/workflows/sync-ti-day3.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Day 3 schedule
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/seed.json')
          d=json.loads(p.read_text())
          matches=d['matches']
          ids={m.get('id') for m in matches}
          new=[]
          def add(mid, at, stage, a, b, status='upcoming'):
            if mid in ids: return
            new.append({
              'id':mid,'startsAt':at,'stage':stage,'stream':None,'bestOf':3,
              'teams':[{'name':a,'score':None},{'name':b,'score':None}],
              'status':status,'source':'public-upcoming'
            })
          # Round 4: public schedule source currently links each row to Liquipedia TI2026 Group Stage Round 4.
          add('seed-d3-r4-1000-a','2026-08-15T10:00:00+08:00','瑞士轮 · 第4轮 · 2-1 / 1-2','LGD Gaming','Xtreme Gaming')
          add('seed-d3-r4-1000-b','2026-08-15T10:00:00+08:00','瑞士轮 · 第4轮 · 2-1 / 1-2','Team Falcons','GamerLegion')
          add('seed-d3-r4-1000-c','2026-08-15T10:00:00+08:00','瑞士轮 · 第4轮 · 2-1 / 1-2','Team Resilience','Team Yandex')
          add('seed-d3-r4-1000-d','2026-08-15T10:00:00+08:00','瑞士轮 · 第4轮 · 2-1 / 1-2','OG','HULIGANI')
          add('seed-d3-r4-1300-a','2026-08-15T13:00:00+08:00','瑞士轮 · 第4轮 · 2-1 / 1-2','TEAM VISION','Team Spirit')
          add('seed-d3-r4-1300-b','2026-08-15T13:00:00+08:00','瑞士轮 · 第4轮 · 2-1 / 1-2','Iron Wing','Team Liquid')
          add('seed-d3-r4-1300-c','2026-08-15T13:00:00+08:00','瑞士轮 · 第4轮 · 2-1 / 1-2','BoomBoys','Aurora Gaming')
          add('seed-d3-r4-1300-d','2026-08-15T13:00:00+08:00','瑞士轮 · 第4轮 · 2-1 / 1-2','Nigma Galaxy','Vici Gaming')
          # Round 5 slots are published with times but pairings remain TBD. Preserve exactly that state; never infer Swiss pairings.
          for i in range(1,5):
            add(f'seed-d3-r5-1600-{i}','2026-08-15T16:00:00+08:00','瑞士轮 · 第5轮','待定','待定','tbd')
          for i in range(1,4):
            add(f'seed-d3-r5-1900-{i}','2026-08-15T19:00:00+08:00','瑞士轮 · 第5轮','待定','待定','tbd')
          matches.extend(new)
          matches.sort(key=lambda m:(m.get('startsAt',''),m.get('id','')))
          for x in d.get('timeline',[]):
            if x.get('date')=='2026-08-15':
              x['detail']='Day 3 已发布：10:00、13:00 各 4 场第4轮 BO3；第5轮已发布 16:00 四个赛程位与 19:00 三个赛程位，具体双方仍为 TBD，待官方/赛事源确认后自动同步。'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          print('added',len(new),'schedule rows')
          PY
      - name: Validate JS and JSON
        run: |
          python3 -m json.tool data/seed.json >/dev/null
          node --check server.js
          node --check public/app.js
          node --check public/predictions.js
          if git diff --name-only | grep -q '^public/assets/teams-normal/'; then
            echo 'ERROR: team logos must not be modified' >&2
            exit 1
          fi
          git diff --check
      - name: Commit synced schedule and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/sync-ti-day3.yml
          git add data/seed.json
          git commit -m 'Sync confirmed TI2026 Day 3 schedule'
          git push

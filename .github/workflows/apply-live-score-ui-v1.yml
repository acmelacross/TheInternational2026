name: Apply live score and compact AI UI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-live-score-ui-v1.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply patch
        run: python3 scripts/patch-live-score-ui-v1.py
      - name: Validate
        run: |
          node --check server.js
          node --check public/app.js
          node --check public/ai-analysis.js
          grep -q 'compact AI status v1' public/v135.css
          grep -q 'LIVE_REFRESH_INTERVAL_SECONDS' server.js
          grep -q 'fetchOpenDotaProResults' server.js
          grep -q 'applyOpenDotaScores' server.js
          grep -q 'OpenDota proMatches' server.js
          grep -q "setInterval(() => load(false), 60 \* 1000)" public/app.js
          grep -q "d?.error==='not_found'" public/ai-analysis.js
      - name: Commit result
        run: |
          rm -f .github/workflows/apply-live-score-ui-v1.yml scripts/patch-live-score-ui-v1.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Compact AI status and sync TI scores with OpenDota"
          git push

name: Sync TI UBSF2 result
on:
  push:
    paths:
      - '.github/workflows/sync-ti-ubsf2-result.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update confirmed result
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/seed.json')
          data=json.loads(p.read_text())
          changed=0
          for m in data.get('matches',[]):
              if m.get('stage')=='主赛事 · 胜者组半决赛 2' and [t.get('name') for t in m.get('teams',[])]==['Team Yandex','Nigma Galaxy']:
                  m['teams'][0]['score']=2
                  m['teams'][1]['score']=1
                  m['status']='finished'
                  m['source']='blast-confirmed-result'
                  changed+=1
          if changed != 2:
              raise SystemExit(f'expected 2 duplicate match records, changed={changed}')
          for item in data.get('timeline',[]):
              if item.get('date')=='2026-08-21':
                  item['detail']='主赛事 Day 2 已全部结束：10:00 Iron Wing 1:2 BoomBoys；14:15 Team Liquid 2:1 Team Falcons；18:20 Team Spirit 0:2 TEAM VISION；21:30 Team Yandex 2:1 Nigma Galaxy。'
                  item['note']='以上四场均为 BLAST 已明确发布的最终赛果；8 月 22 日继续只同步可靠数据源明确发布的对阵与时间，不根据晋级关系自行推算后续 TBD。'
                  break
          else:
              raise SystemExit('missing 2026-08-21 timeline')
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Validate
        shell: bash
        run: |
          python3 -m json.tool data/seed.json >/dev/null
          node --check server.js
          node --check public/app.js
          node --check public/predictions.js
          node --check public/ai-analysis.js
          npm test
          git diff --check
          if ! git diff --quiet -- public/assets/teams-normal; then
            echo 'ERROR: team logos changed' >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          d=json.load(open('data/seed.json'))
          ms=[m for m in d['matches'] if m.get('stage')=='主赛事 · 胜者组半决赛 2' and [t.get('name') for t in m.get('teams',[])]==['Team Yandex','Nigma Galaxy']]
          assert len(ms)==2, len(ms)
          assert all([t.get('score') for t in m['teams']]==[2,1] and m['status']=='finished' and m['source']=='blast-confirmed-result' for m in ms)
          print('confirmed records:',len(ms))
          PY
      - name: Commit to main and clean workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/sync-ti-ubsf2-result.yml
          git add -- data/seed.json
          git commit -m 'Sync confirmed TI2026 UBSF2 result'
          git push origin HEAD:main

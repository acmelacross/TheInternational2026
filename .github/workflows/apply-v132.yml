name: Apply TI2026 v1.3.2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-v132.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply v1.3.2 source changes
        run: node scripts/apply-v132.js
      - name: Download original-color team logos to local cache
        run: node scripts/refresh-team-logos.js
      - name: Validate
        run: |
          node --check server.js
          node --check public/app.js
          node --check public/match.js
          node --check scripts/refresh-team-logos.js
          node tests.js
      - name: Remove one-time upgrade files
        run: |
          rm -f scripts/apply-v132.js
          rm -f .github/workflows/apply-v132.yml
      - name: Commit v1.3.2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update TI2026 viewing guide to v1.3.2"
          git push

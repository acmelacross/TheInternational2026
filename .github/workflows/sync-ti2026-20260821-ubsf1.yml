name: Sync TI2026 UBSF1 result
on:
  push:
    paths:
      - 'scripts/sync_ti2026_20260821_ubsf1.py'
      - '.github/workflows/sync-ti2026-20260821-ubsf1.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply confirmed result
        run: python3 scripts/sync_ti2026_20260821_ubsf1.py
      - name: Validate
        run: |
          python3 -m json.tool data/seed.json >/dev/null
          node --check server.js
          node --check public/app.js
          node --check public/predictions.js
          node --check public/ai-analysis.js
          npm test
          git diff --check
          test -z "$(git status --short public/assets/teams-normal)"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/sync_ti2026_20260821_ubsf1.py .github/workflows/sync-ti2026-20260821-ubsf1.yml
          git add data/seed.json
          git commit -m "Sync confirmed TI2026 UBSF1 result"
          git push

name: Temporary apply TI2026 sync
on:
  push:
    branches: [tmp-ti2026-check-20260820-2051]
    paths:
      - 'scripts/tmp_apply_ti2026_sync.py'
      - '.github/workflows/tmp-apply-ti2026-sync.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare updater
        run: cp scripts/tmp_apply_ti2026_sync.py /tmp/apply_ti2026.py
      - name: Switch to main and apply
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          python3 /tmp/apply_ti2026.py
      - name: Validate
        run: |
          python3 -m json.tool data/seed.json >/dev/null
          node --check server.js
          node --check public/app.js
          node --check public/predictions.js
          node --check public/ai-analysis.js
          npm test
          git diff --check
          test "$(git diff --name-only)" = "data/seed.json"
          if git diff --name-only | grep -q '^public/assets/teams-normal/'; then exit 1; fi
      - name: Commit to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/seed.json
          git commit -m "Sync latest TI2026 Aug 20-21 schedule"
          git push origin main

name: Check TI 2241
on:
  push:
    paths: ['.github/workflows/check-ti-2241.yml']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch current schedule
        run: |
          set -e
          mkdir -p tmp
          curl -fsSL --max-time 30 -A 'Mozilla/5.0 TI2026-check' 'https://ti.xgoat.top/api/schedule/wiki?year=2026' -o /tmp/x.json
          python3 - <<'PY' > tmp/ti-current-output.json
          import json
          d=json.load(open('/tmp/x.json'))
          out={'meta':{k:d.get(k) for k in ['source','fetchedAt','revisionAt','revisionId','stale']},'matches':[]}
          for st in d.get('stages',[]):
            for rd in st.get('rounds',[]):
              for m in rd.get('matches',[]):
                t=m.get('scheduledAt','')
                if t.startswith('2026-08-20') or t.startswith('2026-08-21'):
                  out['matches'].append({'stage':st.get('label'),'round':rd.get('title'),'match':m})
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/ti-current-output.json
          git commit -m 'Temporary TI schedule snapshot 2241'
          git push

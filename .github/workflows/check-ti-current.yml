name: Check TI current schedule
on:
  push:
    paths:
      - 'scripts/check_ti_current.py'
      - '.github/workflows/check-ti-current.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_ti_current.py

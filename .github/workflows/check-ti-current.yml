name: Check TI current schedule
on:
  push:
    paths:
      - 'scripts/check_ti_current.py'
      - '.github/workflows/check-ti-current.yml'
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_ti_current.py | tee ti-current-check.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ti-current-check.txt
          git commit -m "Record temporary TI current schedule check" || exit 0
          git push

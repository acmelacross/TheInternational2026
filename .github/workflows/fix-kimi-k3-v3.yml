name: Fix Kimi K3 final output

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-kimi-k3-v3.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Patch Kimi K3 request
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ai-service.js')
          s = p.read_text(encoding='utf-8')

          old_rev = "kimi:'kimi-k3-output-v2-20260813'"
          new_rev = "kimi:'kimi-k3-json-v3-20260813'"
          if old_rev not in s:
              raise SystemExit('Kimi cache revision marker not found')
          s = s.replace(old_rev, new_rev, 1)

          old_provider = "{ id:'kimi', name:'Kimi K3', vendor:'Moonshot AI', api:'chat', key:envFirst('KIMI_API_KEY','MOONSHOT_API_KEY'), model:envFirst('KIMI_MODEL')||'kimi-k3', baseUrl:cleanBase(envFirst('KIMI_BASE_URL')||'https://api.moonshot.cn/v1'), body:{ reasoning_effort:'low', max_tokens:undefined } },"
          new_provider = "{ id:'kimi', name:'Kimi K3', vendor:'Moonshot AI', api:'chat', key:envFirst('KIMI_API_KEY','MOONSHOT_API_KEY'), model:envFirst('KIMI_MODEL')||'kimi-k3', baseUrl:cleanBase(envFirst('KIMI_BASE_URL')||'https://api.moonshot.cn/v1'), timeoutMs:280000, body:{ reasoning_effort:'low', response_format:{type:'json_object'}, max_tokens:undefined, max_completion_tokens:16384 } },"
          if old_provider not in s:
              raise SystemExit('Kimi provider definition not found')
          s = s.replace(old_provider, new_provider, 1)

          old_timeout = "signal:AbortSignal.timeout(120000)"
          new_timeout = "signal:AbortSignal.timeout(p.timeoutMs||120000)"
          if old_timeout not in s:
              raise SystemExit('fetch timeout marker not found')
          s = s.replace(old_timeout, new_timeout, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate
        run: |
          node --check ai-service.js
          grep -q "kimi-k3-json-v3-20260813" ai-service.js
          grep -q "max_completion_tokens:16384" ai-service.js
          grep -q "response_format:{type:'json_object'}" ai-service.js
          grep -q "timeoutMs:280000" ai-service.js

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/fix-kimi-k3-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Kimi K3 structured final output"
          git push

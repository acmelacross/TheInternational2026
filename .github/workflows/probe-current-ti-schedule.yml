name: Probe current TI schedule
on:
  push:
    paths:
      - '.github/workflows/probe-current-ti-schedule.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe current public sources
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          import json, urllib.request, datetime
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 TI2026-schedule-probe','Accept':'application/json,text/html,*/*'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  return r.read().decode('utf-8','replace')
          print('=== SITE API ===')
          for url in ['https://ti2026.buer.top/api/ti2026','https://ti2026.buer.top/api/source-health']:
              try:
                  t=get(url)
                  print(url, t[:30000])
              except Exception as e: print(url,'ERR',repr(e))
          print('=== OPENDOTA LIVE ===')
          try:
              rows=json.loads(get('https://api.opendota.com/api/live'))
              ti=[r for r in rows if int(r.get('league_id') or r.get('leagueid') or 0)==19719]
              print(json.dumps(ti,ensure_ascii=False)[:30000])
          except Exception as e: print('ERR',repr(e))
          print('=== OPENDOTA PRO ===')
          try:
              rows=json.loads(get('https://api.opendota.com/api/proMatches'))
              ti=[r for r in rows if int(r.get('leagueid') or r.get('league_id') or 0)==19719 or ('international' in str(r.get('league_name','')).lower() and '2026' in str(r.get('league_name','')))]
              print(json.dumps(ti[:120],ensure_ascii=False)[:60000])
          except Exception as e: print('ERR',repr(e))
          print('=== PERFECT WORLD PAGE ===')
          try:
              t=get('https://www.dota2.com.cn/international/2026')
              for needle in ['Latest Schedule','最新赛程','Xtreme Gaming','Team Spirit','August 15','8月15']:
                  i=t.find(needle)
                  if i>=0: print(needle,t[max(0,i-1500):i+7000])
          except Exception as e: print('ERR',repr(e))
          print('=== BLAST SERIES PAGE ===')
          try:
              t=get('https://blast.tv/dota/tournaments/the-international-2026/series')
              print(t[:50000])
          except Exception as e: print('ERR',repr(e))
          PY
      - name: Remove probe workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/probe-current-ti-schedule.yml
          git commit -m "Remove one-time TI schedule probe" || true
          git push || true

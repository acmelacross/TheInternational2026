name: Refresh real team logos

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Refresh local team logos
        run: node scripts/refresh-team-logos.js
      - name: Commit refreshed logos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seed.json public/assets/teams-normal
          if git diff --cached --quiet; then
            echo "No logo changes"
            exit 0
          fi
          git commit -m "Refresh original-color team logos"
          git push

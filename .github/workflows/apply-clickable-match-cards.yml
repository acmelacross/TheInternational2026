name: Apply clickable match cards

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-clickable-match-cards.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply patch
        run: python3 scripts/patch-clickable-match-cards.py
      - name: Validate
        run: |
          node --check public/app.js
          grep -q 'data-detail-href' public/app.js
          grep -q 'bindMatchCardNavigation' public/app.js
          grep -q 'clickable match cards' public/v135.css
      - name: Commit result
        run: |
          rm -f .github/workflows/apply-clickable-match-cards.yml scripts/patch-clickable-match-cards.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make match cards open details on full-card click"
          git push
# retry-after-script-fix

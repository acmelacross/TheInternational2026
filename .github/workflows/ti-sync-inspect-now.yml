name: TI sync inspect now
on:
  push:
    paths:
      - '.github/workflows/ti-sync-inspect-now.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch current public schedules and compare seed
        shell: bash
        run: |
          python3 - <<'PY' > ti-current-check.txt
          import json, urllib.request, re
          from pathlib import Path
          ua='Mozilla/5.0 TI2026-sync-check/1.0'
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':ua,'Accept':'*/*','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
              with urllib.request.urlopen(req,timeout=25) as r:
                  return r.status, r.headers.get('content-type',''), r.read().decode('utf-8','replace')
          seed=json.loads(Path('data/seed.json').read_text())
          print('HEAD_SEED_MAIN_EVENT')
          for m in seed.get('matches',[]):
              if str(m.get('startsAt','')) >= '2026-08-20':
                  print(json.dumps({k:m.get(k) for k in ['id','startsAt','stage','bestOf','teams','status','source']},ensure_ascii=False))
          for t in seed.get('timeline',[]):
              if str(t.get('date','')) >= '2026-08-20':
                  print('TIMELINE',json.dumps(t,ensure_ascii=False))
          s,ct,b=get('https://ti.xgoat.top/api/schedule/wiki?year=2026')
          print('XGOAT_STATUS',s,ct,len(b))
          d=json.loads(b)
          print('XGOAT_META',json.dumps({k:d.get(k) for k in ['source','fetchedAt','revisionAt','revisionId','stale','coverage']},ensure_ascii=False))
          for st in d.get('stages',[]):
              for rnd in st.get('rounds',[]):
                  for m in rnd.get('matches',[]):
                      at=str(m.get('scheduledAt',''))
                      if at >= '2026-08-20':
                          print('XGOAT_MATCH',json.dumps({'stage':st.get('label') or st.get('id'),'round':rnd.get('title') or rnd.get('id'),'id':m.get('id'),'scheduledAt':at,'status':m.get('status'),'bestOf':m.get('bestOf'),'opponents':[[o.get('name'),o.get('score')] for o in m.get('opponents',[])]},ensure_ascii=False))
          s,ct,b=get('https://blast.tv/dota/tournaments/the-international-2026/match')
          print('BLAST_STATUS',s,ct,len(b))
          text=re.sub(r'<[^>]+>',' ',b); text=re.sub(r'\s+',' ',text)
          for key in ['Iron Wing','BetBoom Team','Team Liquid','Team Falcons','Team Spirit','PARIVISION','Team Yandex','Nigma Galaxy','Saturday, Aug 22','Sunday, Aug 23']:
              i=text.find(key)
              if i>=0: print('BLAST_HIT',key,text[max(0,i-320):i+700])
          PY
      - name: Commit inspection snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ti-current-check.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh TI2026 source inspection snapshot"
          git push

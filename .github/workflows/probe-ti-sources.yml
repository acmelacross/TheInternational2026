name: Probe TI sources
on:
  push:
    paths:
      - '.github/workflows/probe-ti-sources.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe sources
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, datetime
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'TI2026-probe/1.0','Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  return json.load(r)
          def dt(ts):
              try:return datetime.datetime.fromtimestamp(int(ts),datetime.timezone.utc).isoformat()
              except:return str(ts)
          print('=== LEAGUE 19719 ===')
          try:
              rows=get('https://api.opendota.com/api/leagues/19719/matches')
              print('COUNT',len(rows))
              for r in sorted(rows,key=lambda x:int(x.get('start_time') or 0))[-40:]:
                  print(dt(r.get('start_time')),r.get('series_id'),r.get('match_id'),r.get('radiant_name'), 'vs', r.get('dire_name'), 'rw',r.get('radiant_win'))
          except Exception as e: print('ERR',repr(e))
          print('=== PRO MATCHES TI ===')
          try:
              rows=get('https://api.opendota.com/api/proMatches')
              ti=[r for r in rows if 'international' in str(r.get('league_name','')).lower()]
              print('COUNT',len(ti))
              for r in sorted(ti,key=lambda x:int(x.get('start_time') or 0))[-40:]:
                  print(dt(r.get('start_time')),r.get('series_id'),r.get('match_id'),r.get('radiant_name'),'vs',r.get('dire_name'),'rw',r.get('radiant_win'))
          except Exception as e: print('ERR',repr(e))
          print('=== LIVE league 19719 ===')
          try:
              rows=get('https://api.opendota.com/api/live')
              ti=[r for r in rows if int(r.get('league_id') or r.get('leagueid') or 0)==19719]
              print('COUNT',len(ti))
              for r in ti:
                  print(json.dumps({k:r.get(k) for k in ['match_id','series_id','league_id','activate_time','team_name_radiant','team_name_dire','radiant_series_wins','dire_series_wins']},ensure_ascii=False))
          except Exception as e: print('ERR',repr(e))
          print('=== PUBLIC UPCOMING ===')
          try:
              rows=get('https://dota.haglund.dev/v1/matches')
              ti=[r for r in rows if 'international' in str(r.get('leagueName','')).lower() and '2026' in str(r.get('leagueName',''))]
              print('COUNT',len(ti))
              for r in ti[:40]: print(json.dumps(r,ensure_ascii=False))
          except Exception as e: print('ERR',repr(e))
          PY
      - name: Remove probe workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/probe-ti-sources.yml
          git commit -m "Remove TI source probe workflow"
          git push

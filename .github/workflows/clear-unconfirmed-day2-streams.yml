name: Clear unconfirmed Day 2 stream assignments
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/clear-unconfirmed-day2-streams.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clear inferred streams
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/seed.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          for m in d.get('matches',[]):
              if str(m.get('id','')).startswith('seed-d2-'):
                  m['stream']=None
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python3 -m json.tool data/seed.json >/dev/null
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/clear-unconfirmed-day2-streams.yml
          git add data/seed.json
          git commit -m "Avoid inferring Day 2 stream assignments"
          git push

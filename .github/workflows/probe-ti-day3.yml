name: Probe TI2026 Day 3 public schedules
on:
  push:
    paths:
      - '.github/workflows/probe-ti-day3.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe public sources
        run: |
          python3 - <<'PY'
          import json,re,urllib.request,urllib.parse
          H={'User-Agent':'Mozilla/5.0 TI2026 schedule probe','Accept':'*/*'}
          def get(url):
            req=urllib.request.Request(url,headers=H)
            with urllib.request.urlopen(req,timeout=30) as r:
              return r.getcode(),r.headers.get('content-type',''),r.read().decode('utf-8','replace')
          urls=[
            'https://www.dota2.com.cn/international/2026',
            'https://liquipedia.net/dota2/The_International/2026/Group_Stage',
            'https://blast.tv/dota/tournaments/the-international-2026/series',
            'https://api.opendota.com/api/leagues/19719/matches',
            'https://api.opendota.com/api/proMatches',
            'https://api.opendota.com/api/live',
            'https://dota.haglund.dev/v1/matches'
          ]
          for u in urls:
            print('\n===',u,'===')
            try:
              code,ct,txt=get(u); print('HTTP',code,ct,'LEN',len(txt))
              if 'application/json' in ct or txt[:1] in '[{':
                try:
                  obj=json.loads(txt)
                  if isinstance(obj,list):
                    print('JSON_COUNT',len(obj))
                    # print TI-ish / recent rows only
                    rows=[]
                    for r in obj:
                      s=json.dumps(r,ensure_ascii=False)
                      if '19719' in s or 'International' in s or '2026' in s:
                        rows.append(r)
                    print('FILTERED',len(rows))
                    for r in rows[-80:]: print(json.dumps(r,ensure_ascii=False)[:1500])
                  else: print(json.dumps(obj,ensure_ascii=False)[:8000])
                except Exception as e: print('JSON_ERR',e,txt[:3000])
              else:
                # Extract script/src/API hints and lines around schedule/matches/day3/Aug15
                pats=['Latest Schedule','schedule','match','8月15','08-15','Aug 15','Round 4','Round 5','2026-08-15']
                for p in pats:
                  i=txt.lower().find(p.lower())
                  if i>=0: print('HIT',p,txt[max(0,i-1000):i+4000].replace('\n',' ')[:5000])
                for x in re.findall(r'https?://[^\"\'<> ]+',txt):
                  if any(k in x.lower() for k in ['api','match','schedule','international']): print('URL',x[:1000])
            except Exception as e: print('ERR',repr(e))
          PY
      - name: Remove probe workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/probe-ti-day3.yml
          git commit -m 'Remove TI Day 3 probe workflow'
          git push

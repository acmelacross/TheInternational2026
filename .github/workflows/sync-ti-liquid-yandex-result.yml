name: Sync TI Liquid Yandex result
on:
  push:
    paths: ['.github/workflows/sync-ti-liquid-yandex-result.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update confirmed result
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/seed.json')
          d=json.loads(p.read_text())
          changed=0
          target_ids={'seed-me-ubqf3','seed-main-0820-ubqf3'}
          for m in d.get('matches',[]):
              if m.get('id') not in target_ids:
                  continue
              names=[t.get('name') for t in m.get('teams',[])[:2]]
              if names!=['Team Liquid','Team Yandex']:
                  raise SystemExit(f'unexpected teams for {m.get("id")}: {names}')
              m['teams'][0]['score']=2
              m['teams'][1]['score']=1
              m['status']='finished'
              m['source']='blast-confirmed-result'
              changed+=1
          if changed!=2:
              raise SystemExit(f'expected 2 target matches, changed={changed}')
          for item in d.get('timeline',[]):
              for key in ('note','summary','description'):
                  v=item.get(key)
                  if isinstance(v,str) and '18:30 Team Liquid vs Team Yandex' in v:
                      item[key]=v.replace('18:30 Team Liquid vs Team Yandex','18:30 Team Liquid 2:1 Team Yandex')
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Validate
        run: |
          python3 -m json.tool data/seed.json >/dev/null
          node --check server.js
          node --check public/app.js
          node --check public/predictions.js
          node --check public/ai-analysis.js
          npm test
          git diff --check
          if ! git diff --quiet -- public/assets/teams-normal; then
            echo 'teams-normal was modified unexpectedly' >&2
            exit 1
          fi
      - name: Commit result and cleanup temporary checks
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/check-ti-2241.yml .github/workflows/sync-ti-liquid-yandex-result.yml tmp/ti-current-output.json
          git add -A data/seed.json .github/workflows/check-ti-2241.yml .github/workflows/sync-ti-liquid-yandex-result.yml tmp/ti-current-output.json 2>/dev/null || true
          git commit -m 'Sync confirmed TI2026 Liquid vs Yandex result'
          git push

name: Apply TI2026 v1.3.5

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-v135.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Snapshot user logos
        run: find public/assets/teams-normal -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/logos.before
      - name: Apply v1.3.5
        run: node scripts/apply-v135.js
      - name: Verify user logos unchanged
        run: |
          find public/assets/teams-normal -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/logos.after
          diff -u /tmp/logos.before /tmp/logos.after
      - name: Syntax and project tests
        run: |
          node --check server.js
          node --check ai-service.js
          node --check public/ai-analysis.js
          node --check public/app.js
          node --check public/match.js
          node tests.js
          test "$(cat VERSION)" = "1.3.5"
          grep -q '理性观赛、娱乐观赛' public/index.html
          grep -q '理性观赛、娱乐观赛' public/match.html
          grep -q 'gamePredictions' ai-service.js
          grep -q 'relationshipContext' ai-service.js
          test -f deploy/linux/baota-git-deploy.sh
      - name: Secret guard
        run: |
          if git grep -nE '(sk-[A-Za-z0-9._-]{20,}|bce-v3/[A-Za-z0-9/_-]{20,}|afd69bd5-|sk-Vlr7)' -- ':!*.md' ':!.env.example'; then
            echo 'Potential secret found in tracked source' >&2
            exit 1
          fi
      - name: Remove one-time upgrade files
        run: |
          rm -f scripts/apply-v135.js
          rm -f .github/workflows/apply-v135.yml
      - name: Commit v1.3.5
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update TI2026 viewing guide to v1.3.5"
          git push

name: Fix Kimi K3 curl transport

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-kimi-k3-curl-transport.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply patch
        run: python3 scripts/patch-kimi-curl-v7.py
      - name: Validate
        run: |
          node --check ai-service.js
          grep -q "kimi-k3-curl-v7-20260813" ai-service.js
          grep -q "function curlPostJson" ai-service.js
          grep -q "p.id==='kimi'" ai-service.js
          grep -q "spawn('curl'" ai-service.js
          grep -q "https://api.moonshot.cn/v1" ai-service.js
      - name: Commit result
        run: |
          rm -f .github/workflows/fix-kimi-k3-curl-transport.yml scripts/patch-kimi-curl-v7.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use curl transport for Kimi K3 behind WAF"
          git push

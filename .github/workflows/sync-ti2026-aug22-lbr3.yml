name: Sync TI2026 Aug22 LBR3
on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync_ti2026_aug22_lbr3.py'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply confirmed pairing
        run: python3 scripts/sync_ti2026_aug22_lbr3.py
      - name: Validate JSON and JS
        run: |
          python3 -m json.tool data/seed.json >/dev/null
          node --check server.js
          node --check public/app.js
          node --check public/predictions.js
          node --check public/ai-analysis.js
          npm test
          git diff --check
          if git status --short public/assets/teams-normal | grep .; then
            echo 'team logos changed unexpectedly' >&2
            exit 1
          fi
      - name: Commit and clean temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/sync_ti2026_aug22_lbr3.py .github/workflows/sync-ti2026-aug22-lbr3.yml
          git add data/seed.json
          git commit -m "Sync confirmed TI2026 Aug 22 lower bracket semifinal"
          git push

name: Apply TI latest 20260823
on:
  push:
    paths:
      - 'scripts/apply_ti_latest_20260823.py'
      - '.github/workflows/apply-ti-latest-20260823.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Protect logos baseline
        run: git status --porcelain -- public/assets/teams-normal > /tmp/logo-before.txt
      - name: Apply confirmed updates
        run: python3 scripts/apply_ti_latest_20260823.py
      - name: Validate
        run: |
          python3 -m json.tool data/seed.json >/dev/null
          node --check server.js
          node --check public/app.js
          node --check public/predictions.js
          node --check public/ai-analysis.js
          npm test
          git diff --check
          test -z "$(git status --porcelain -- public/assets/teams-normal)"
      - name: Commit verified update and cleanup temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/check_ti_latest_20260823.py scripts/apply_ti_latest_20260823.py ti-latest-check.txt
          rm -f .github/workflows/check-ti-latest-20260823.yml .github/workflows/apply-ti-latest-20260823.yml
          git add -A
          git commit -m "Sync confirmed TI2026 Aug 22-23 updates"
          git push

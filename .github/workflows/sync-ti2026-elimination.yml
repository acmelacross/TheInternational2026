name: Sync TI2026 elimination schedule
on:
  push:
    paths:
      - '.github/workflows/sync-ti2026-elimination.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply confirmed Aug 16 elimination pairings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/seed.json')
          d=json.loads(p.read_text())
          replacements={
            'seed-d4-elim-2000-1':('2026-08-16T10:00:00+08:00','Team Falcons','Vici Gaming'),
            'seed-d4-elim-2000-2':('2026-08-16T10:00:00+08:00','Aurora Gaming','BoomBoys'),
            'seed-d4-elim-2000-3':('2026-08-16T13:00:00+08:00','Team Spirit','Team Resilience'),
            'seed-d4-elim-2000-4':('2026-08-16T13:00:00+08:00','Iron Wing','GamerLegion'),
            'seed-d4-elim-2200-5':('2026-08-16T16:00:00+08:00','LGD Gaming','Team Yandex'),
          }
          seen=set()
          for m in d['matches']:
            if m.get('id') in replacements:
              at,a,b=replacements[m['id']]
              m['startsAt']=at
              m['stage']='淘汰轮 · 3-2 对 2-3 · 已确认对阵'
              m['stream']=None
              m['bestOf']=3
              m['teams']=[{'name':a,'score':None},{'name':b,'score':None}]
              m['status']='upcoming'
              m['source']='liquipedia-mediawiki-published'
              seen.add(m['id'])
          missing=set(replacements)-seen
          if missing: raise SystemExit(f'missing elimination placeholders: {sorted(missing)}')
          for x in d.get('timeline',[]):
            if x.get('date')=='2026-08-16':
              x['title']='淘汰轮'
              x['detail']='淘汰轮 5 场 BO3 已由 Liquipedia MediaWiki 明确发布：10:00 Falcons vs Vici、Aurora vs BoomBoys；13:00 Spirit vs Resilience、Iron Wing vs GamerLegion；16:00 LGD vs Yandex。网站仅同步已发布对阵，不根据瑞士轮战绩自行推算。'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Validate project
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool data/seed.json >/dev/null
          node --check server.js
          node --check public/app.js
          node --check public/predictions.js
          node --check public/ai-analysis.js
          npm test
          git diff --check
          if git diff --name-only | grep -q '^public/assets/teams-normal/'; then
            echo 'ERROR: team logos were modified' >&2
            exit 1
          fi
      - name: Commit synchronized schedule and clean workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/sync-ti2026-elimination.yml
          git add data/seed.json
          git commit -m 'Sync confirmed TI2026 elimination round pairings'
          git push

name: Sync TI2026 published Round 5 schedule
on:
  push:
    paths:
      - '.github/workflows/sync-ti2026-round5.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Round 5 published pairings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/seed.json')
          d=json.loads(p.read_text())
          old=d.get('matches',[])
          kept=[]
          removed=[]
          for m in old:
            stage=str(m.get('stage',''))
            at=str(m.get('startsAt',''))
            if at.startswith('2026-08-15') and ('第5轮' in stage or 'Round 5' in stage):
              removed.append(m)
            else:
              kept.append(m)
          new=[
            {'id':'seed-d3-r5-res-xg','startsAt':'2026-08-15T17:30:00+08:00','stage':'瑞士轮 · 第5轮 · 已确认对阵','stream':None,'bestOf':3,'teams':[{'name':'Team Resilience','score':2},{'name':'Xtreme Gaming','score':0}],'status':'finished','source':'liquipedia-mediawiki-published'},
            {'id':'seed-d3-r5-og-gl','startsAt':'2026-08-15T17:30:00+08:00','stage':'瑞士轮 · 第5轮 · 已确认对阵','stream':None,'bestOf':3,'teams':[{'name':'OG','score':0},{'name':'GamerLegion','score':2}],'status':'finished','source':'liquipedia-mediawiki-published'},
            {'id':'seed-d3-r5-lgd-vg','startsAt':'2026-08-15T17:40:00+08:00','stage':'瑞士轮 · 第5轮 · 已确认对阵','stream':None,'bestOf':3,'teams':[{'name':'LGD Gaming','score':None},{'name':'Vici Gaming','score':None}],'status':'upcoming','source':'liquipedia-mediawiki-published'},
            {'id':'seed-d3-r5-bb-falcons','startsAt':'2026-08-15T18:40:00+08:00','stage':'瑞士轮 · 第5轮 · 已确认对阵','stream':None,'bestOf':3,'teams':[{'name':'BoomBoys','score':None},{'name':'Team Falcons','score':None}],'status':'upcoming','source':'liquipedia-mediawiki-published'},
            {'id':'seed-d3-r5-iw-yandex','startsAt':'2026-08-15T19:45:00+08:00','stage':'瑞士轮 · 第5轮 · 已确认对阵','stream':None,'bestOf':3,'teams':[{'name':'Iron Wing','score':None},{'name':'Team Yandex','score':None}],'status':'upcoming','source':'liquipedia-mediawiki-published'},
            {'id':'seed-d3-r5-liquid-aurora','startsAt':'2026-08-15T20:00:00+08:00','stage':'瑞士轮 · 第5轮 · 已确认对阵','stream':None,'bestOf':3,'teams':[{'name':'Team Liquid','score':None},{'name':'Aurora Gaming','score':None}],'status':'upcoming','source':'liquipedia-mediawiki-published'},
            {'id':'seed-d3-r5-nigma-spirit','startsAt':'2026-08-15T21:00:00+08:00','stage':'瑞士轮 · 第5轮 · 已确认对阵','stream':None,'bestOf':3,'teams':[{'name':'Nigma Galaxy','score':None},{'name':'Team Spirit','score':None}],'status':'upcoming','source':'liquipedia-mediawiki-published'},
          ]
          d['matches']=sorted(kept+new,key=lambda m:(m.get('startsAt',''),m.get('id','')))
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          print('REMOVED_ROUND5',len(removed))
          for m in removed: print('OLD',m.get('startsAt'),[x.get('name') for x in m.get('teams',[])])
          for m in new: print('NEW',m['startsAt'],[x['name'] for x in m['teams']])
          PY
      - name: Validate project
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool data/seed.json >/dev/null
          node --check server.js
          node --check public/app.js
          node --check public/predictions.js
          node --check public/ai-analysis.js
          npm test
      - name: Commit synced schedule and cleanup temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/sync-ti2026-round5.yml .github/workflows/check-ti2026-latest.yml || true
          git add data/seed.json
          git commit -m 'Sync confirmed TI2026 Round 5 pairings'
          git push origin main

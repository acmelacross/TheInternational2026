name: Check TI2026 latest schedule
on:
  push:
    paths:
      - '.github/workflows/check-ti2026-latest.yml'
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch current XGoat Liquipedia schedule
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 -A 'Mozilla/5.0 TI2026-Schedule-Checker/1.0' 'https://ti.xgoat.top/api/schedule/wiki?year=2026' -o /tmp/xgoat.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/xgoat.json'))
          print('META', json.dumps({k:d.get(k) for k in ['source','fetchedAt','revisionAt','revisionId','stale','coverage']}, ensure_ascii=False))
          rows=[]
          for st in d.get('stages',[]):
              for rd in st.get('rounds',[]):
                  for m in rd.get('matches',[]):
                      at=str(m.get('scheduledAt') or '')
                      if at.startswith('2026-08-16'):
                          rows.append({'stage':st.get('label') or st.get('id'),'round':rd.get('title') or rd.get('id'),'id':m.get('id'),'scheduledAt':at,'status':m.get('status'),'bestOf':m.get('bestOf'),'opponents':[(o.get('name'),o.get('score'),o.get('canonicalKey')) for o in m.get('opponents',[])]})
          print('AUG16_COUNT',len(rows))
          for r in rows: print('AUG16',json.dumps(r,ensure_ascii=False))
          PY
      - name: Remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/check-ti2026-latest.yml
          git commit -m 'Remove temporary TI2026 schedule check'
          git push

name: Check TI2026 latest
on:
  push:
    paths:
      - '.github/workflows/check-ti2026-latest.yml'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and patch confirmed published schedule
        run: |
          python3 - <<'PY'
          import json, urllib.request, pathlib, datetime, sys
          url='https://ti.xgoat.top/api/schedule/wiki?year=2026'
          req=urllib.request.Request(url,headers={'User-Agent':'TI2026-Viewing-Guide/automation','Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=25) as r:
              data=json.load(r)
          if not data.get('ok') or data.get('stale'):
              raise SystemExit('XGoat/Liquipedia payload invalid or stale')
          found=[]
          for stage in data.get('stages',[]):
              for rnd in stage.get('rounds',[]):
                  for m in rnd.get('matches',[]):
                      found.append((stage,rnd,m))
          def names(m):
              return [str(o.get('name') or o.get('shortName') or '') for o in (m.get('opponents') or [])[:2]]
          lf=[]
          for st,rd,m in found:
              if set(names(m))=={'Team Liquid','Team Falcons'} and str(m.get('scheduledAt','')).startswith('2026-08-21'):
                  lf.append((st,rd,m))
          if not lf:
              raise SystemExit('No published Liquid-Falcons match')
          lf_match=lf[-1][2]
          lf_at=str(lf_match.get('scheduledAt'))
          dt=datetime.datetime.fromisoformat(lf_at.replace('Z','+00:00')).astimezone(datetime.timezone(datetime.timedelta(hours=8)))
          lf_local=dt.isoformat(timespec='seconds')
          bb=[]
          for st,rd,m in found:
              ns=names(m)
              if 'BoomBoys' in ns and 'Lower Bracket' in str(rd.get('title') or '') and str(m.get('scheduledAt','')).startswith('2026-08-22'):
                  bb.append((st,rd,m))
          if not bb:
              raise SystemExit('No published Aug22 BoomBoys lower-bracket slot')
          bb_match=sorted(bb,key=lambda x:str(x[2].get('scheduledAt')))[0][2]
          bb_at=str(bb_match.get('scheduledAt'))
          bb_dt=datetime.datetime.fromisoformat(bb_at.replace('Z','+00:00')).astimezone(datetime.timezone(datetime.timedelta(hours=8)))
          bb_local=bb_dt.isoformat(timespec='seconds')
          p=pathlib.Path('data/seed.json')
          seed=json.loads(p.read_text())
          changed=0
          old_times=[]
          for row in seed.get('matches',[]):
              ns=[str(t.get('name','')) for t in row.get('teams',[])[:2]]
              if set(ns)=={'Team Liquid','Team Falcons'} and str(row.get('startsAt','')).startswith('2026-08-21'):
                  old_times.append(row.get('startsAt'))
                  if row.get('startsAt')!=lf_local:
                      row['startsAt']=lf_local
                      row['source']='liquipedia-mediawiki-published'
                      changed+=1
              if '败者组第2轮' in str(row.get('stage','')) and str(row.get('startsAt','')).startswith('2026-08-22'):
                  row_dt=datetime.datetime.fromisoformat(str(row['startsAt']))
                  if abs((row_dt-bb_dt).total_seconds())<60:
                      current=[str(t.get('name','')) for t in row.get('teams',[])[:2]]
                      desired=['待定','BoomBoys']
                      if current!=desired:
                          row['teams']=[{'name':'待定','score':None},{'name':'BoomBoys','score':None}]
                          row['status']='tbd'
                          row['source']='liquipedia-mediawiki-published'
                          changed+=1
          for item in seed.get('timeline',[]):
              if str(item.get('date',''))=='2026-08-21':
                  note=str(item.get('note',''))
                  for old in ['13:30 Team Liquid vs Team Falcons','13:00 Team Liquid vs Team Falcons']:
                      new=f"{dt.strftime('%H:%M')} Team Liquid vs Team Falcons"
                      if old in note and old!=new:
                          item['note']=note.replace(old,new)
                          note=item['note']
                          changed+=1
              if str(item.get('date',''))=='2026-08-22':
                  note=str(item.get('note',''))
                  marker=f"{bb_dt.strftime('%H:%M')} 败者组第2轮"
                  if 'BoomBoys' not in note and marker in note:
                      item['note']=note.replace(marker,marker+'（已确认包含 BoomBoys）')
                      changed+=1
          if not changed:
              raise SystemExit('No changes required')
          p.write_text(json.dumps(seed,ensure_ascii=False,indent=2)+'\n')
          print('META',json.dumps({k:data.get(k) for k in ['source','revisionAt','revisionId','stale','fetchedAt']},ensure_ascii=False))
          print('LIQUID_FALCONS',lf_at,'=>',lf_local,'old',old_times)
          print('BOOMBOYS_SLOT',bb_at,'=>',bb_local,names(bb_match))
          print('PATCHED',changed)
          PY
      - name: Validate
        run: |
          python3 -m json.tool data/seed.json >/dev/null
          node --check server.js
          node --check public/app.js
          node --check public/predictions.js
          node --check public/ai-analysis.js
          npm test
          git diff --check
          if git status --short public/assets/teams-normal | grep .; then echo 'Logo directory changed'; exit 1; fi
      - name: Commit verified update and clean temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/check-ti2026-latest.yml tmp-ti2026-latest.json
          git add data/seed.json
          git commit -m "Sync latest published TI2026 Aug 21-22 schedule"
          git push

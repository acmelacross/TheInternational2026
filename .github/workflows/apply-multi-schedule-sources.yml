name: Apply and verify multi-source TI schedule integration
on:
  push:
    paths:
      - '.github/workflows/apply-multi-schedule-sources.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/apply_multi_schedule_sources.py
      - name: Static validation
        run: |
          node --check server.js
          node --check public/app.js
          python3 -m json.tool data/seed.json >/dev/null
      - name: Start patched service
        run: |
          rm -rf /tmp/ti2026-multisource
          DATA_DIR=/tmp/ti2026-multisource PORT=17829 LIVE_REFRESH_INTERVAL_SECONDS=120 SCHEDULE_SOURCE_TTL_SECONDS=300 node server.js >/tmp/ti2026-multisource.log 2>&1 &
          echo $! >/tmp/ti2026-multisource.pid
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:17829/api/health >/dev/null && break
            sleep 1
          done
      - name: Verify live BLAST and Cybersport data
        run: |
          curl -fsS --max-time 75 -X POST http://127.0.0.1:17829/api/refresh -o /tmp/ti2026-payload.json
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone, timedelta
          d=json.load(open('/tmp/ti2026-payload.json'))
          src=d.get('dataStatus',{}).get('sources',{})
          print('SOURCE=', d.get('source'))
          print('BLAST=', src.get('blastSchedule'))
          print('CYBERSPORT=', src.get('cybersportSchedule'))
          print('OPENDOTA=', src.get('openDotaLeague'))
          print('ERRORS=', d.get('dataStatus',{}).get('errors'))
          assert src.get('blastSchedule',{}).get('status')=='ok', src.get('blastSchedule')
          assert int(src.get('blastSchedule',{}).get('count',0))>=9, src.get('blastSchedule')
          assert src.get('cybersportSchedule',{}).get('status')=='ok', src.get('cybersportSchedule')
          assert int(src.get('cybersportSchedule',{}).get('count',0))>=8, src.get('cybersportSchedule')
          sh=timezone(timedelta(hours=8))
          today=[]
          for m in d.get('matches',[]):
            try: dt=datetime.fromisoformat(m['startsAt'].replace('Z','+00:00')).astimezone(sh)
            except: continue
            if dt.date().isoformat()=='2026-08-15':
              today.append((dt.strftime('%H:%M'), tuple(t.get('name') for t in m.get('teams',[])), m.get('status'), m.get('source'), m.get('slotKey')))
          for x in today: print('MATCH',x)
          normalized={(t, frozenset(teams)) for t,teams,_,_,_ in today if len(teams)>=2 and '待定' not in teams}
          expected=[
            ('10:00', {'Team Resilience','Team Yandex'}),
            ('10:00', {'Team Falcons','GamerLegion'}),
            ('10:00', {'LGD Gaming','Xtreme Gaming'}),
            ('10:00', {'OG','HULIGANI'}),
            ('13:00', {'Team VISION','Team Spirit'}),
            ('13:00', {'Nigma Galaxy','Vici Gaming'}),
            ('13:00', {'BoomBoys','Aurora Gaming'}),
            ('13:00', {'Iron Wing','Team Liquid'}),
          ]
          for t, teams in expected:
            assert (t, frozenset(teams)) in normalized, (t,teams,today)
          tbd20=[x for x in today if x[0]=='20:00' and all(str(n).startswith('待定') for n in x[1])]
          assert len(tbd20)==3, tbd20
          seed=json.load(open('data/seed.json'))
          obsolete=[m for m in seed['matches'] if m.get('startsAt') in ('2026-08-15T16:00:00+08:00','2026-08-15T19:00:00+08:00') and m.get('status')=='tbd']
          assert not obsolete, obsolete
          print('MULTI_SOURCE_VERIFY_OK')
          PY
          curl -fsS http://127.0.0.1:17829/api/source-health
      - name: Commit verified integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply_multi_schedule_sources.py .github/workflows/apply-multi-schedule-sources.yml
          git add server.js public/app.js data/seed.json
          git commit -m "Add BLAST and Cybersport schedule fallbacks"
          git push

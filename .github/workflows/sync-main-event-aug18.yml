name: Sync TI2026 main event schedule
on:
  push:
    paths:
      - 'scripts/sync_main_event_schedule_aug18.py'
      - '.github/workflows/sync-main-event-aug18.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply published BLAST main-event schedule
        run: python3 scripts/sync_main_event_schedule_aug18.py
      - name: Validate project
        run: |
          python3 -m json.tool data/seed.json >/dev/null
          node --check server.js
          node --check public/app.js
          node --check public/predictions.js
          node --check public/ai-analysis.js
          npm test
          git diff --check
      - name: Guard team logo assets
        run: |
          if git diff --name-only | grep '^public/assets/teams-normal/'; then
            echo 'teams-normal changed unexpectedly' >&2
            exit 1
          fi
      - name: Commit verified sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/sync_main_event_schedule_aug18.py .github/workflows/sync-main-event-aug18.yml
          git add data/seed.json
          git commit -m "Sync confirmed TI2026 main-event schedule"
          git push

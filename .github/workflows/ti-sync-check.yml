name: TI sync check
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ti-sync-check.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch current public sources
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, re
          def get(url, accept='*/*'):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 TI2026-SyncCheck/1.0','Accept':accept,'Accept-Language':'en-US,en;q=0.9,zh-CN;q=0.8'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  return r.status, r.headers.get('Content-Type',''), r.read().decode('utf-8','replace')
          print('=== REPO AUG21 ===')
          seed=json.load(open('data/seed.json'))
          for m in seed.get('matches',[]):
              if str(m.get('startsAt','')).startswith(('2026-08-21','2026-08-22','2026-08-23')):
                  print(json.dumps(m,ensure_ascii=False))
          print('=== XGOAT / LIQUIPEDIA MEDIAWIKI ADAPTER ===')
          try:
              s,ct,b=get('https://ti.xgoat.top/api/schedule/wiki?year=2026','application/json')
              d=json.loads(b)
              print('META',json.dumps({k:d.get(k) for k in ['source','fetchedAt','revisionAt','revisionId','stale']},ensure_ascii=False))
              for st in d.get('stages',[]):
                  for rd in st.get('rounds',[]):
                      for m in rd.get('matches',[]):
                          at=str(m.get('scheduledAt',''))
                          if at.startswith(('2026-08-21','2026-08-22','2026-08-23')):
                              print('XGOAT',st.get('label'),rd.get('title'),json.dumps(m,ensure_ascii=False))
          except Exception as e: print('XGOAT_ERR',repr(e))
          print('=== BLAST ===')
          try:
              s,ct,b=get('https://blast.tv/dota/tournaments/the-international-2026/series','text/html')
              print('BLAST_STATUS',s,ct,'LEN',len(b))
              text=re.sub(r'\\s+',' ',re.sub(r'<[^>]+>',' ',b))
              for team in ['Iron Wing','BetBoom','BoomBoys','Team Liquid','Falcons','Team Spirit','PARIVISION','Yandex','Nigma']:
                  i=text.lower().find(team.lower())
                  if i>=0: print('BLAST_HIT',team,text[max(0,i-500):i+1200])
          except Exception as e: print('BLAST_ERR',repr(e))
          print('=== OFFICIAL PROBES ===')
          for u in ['https://www.dota2.com/international/overview','https://www.dota2.com/esports/ti15','https://www.dota2.com/news','https://www.dota2.com.cn/international2026']:
              try:
                  s,ct,b=get(u,'text/html')
                  print('OFFICIAL',u,s,ct,len(b),re.sub(r'\\s+',' ',re.sub(r'<[^>]+>',' ',b))[:700])
              except Exception as e: print('OFFICIAL_ERR',u,repr(e))
          PY

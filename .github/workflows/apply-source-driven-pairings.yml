name: Apply source-driven pairings

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-source-driven-pairings.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply patch
        run: python3 scripts/patch-source-driven-pairings.py
      - name: Validate
        run: |
          node --check server.js
          grep -q 'team_name_radiant' server.js
          grep -q 'team_name_dire' server.js
          grep -q 'mergeOpenDotaSourcePairings' server.js
          ! grep -q 'teamRecordBefore' server.js
          ! grep -q 'hydrateSwissPlaceholders' server.js
      - name: Commit result
        run: |
          rm -f .github/workflows/apply-source-driven-pairings.yml scripts/patch-source-driven-pairings.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use source-driven Swiss pairings"
          git push
